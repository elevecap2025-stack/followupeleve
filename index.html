  --or:#127DCB; --or2:#0A4E83; --orl:#E3F0FA;
  --gr:#231F20; --gr2:#3A3F47; --gr3:#4B515B;
  --bg:#F4F5F7; --card:#FFFFFF; --tx:#1F2328; --mut:#6B7280; --line:#E5E7EB;
  --ok:#16A34A; --okl:#DCFCE7; --bad:#DC2626; --badl:#FEE2E2; --warn:#D97706; --warnl:#FEF3C7; --info:#2563EB; --infol:#DBEAFE;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font:inherit}
a{color:var(--or2)}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 88% 8%,rgba(18,125,203,.45),transparent 38%),radial-gradient(circle at 5% 95%,rgba(10,78,131,.30),transparent 35%),linear-gradient(135deg,var(--gr) 0%,#1a1d22 100%);padding:16px}
.login-box{background:#fff;border-radius:14px;padding:28px 28px 32px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:5px solid var(--or)}
.login-box .logo{display:flex;justify-content:center;margin-bottom:10px}
.login-box h2{margin:6px 0 2px;text-align:center;font-size:18px}
.login-box p.sub{margin:0 0 20px;text-align:center;color:var(--mut);font-size:13px}
.login-box label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.login-box input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px}
.login-box .btn{width:100%;margin-top:20px;padding:12px;justify-content:center}
#loginMsg{color:var(--bad);font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.pw{position:relative}
.pw input{padding-right:46px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:36px;border:0;background:transparent;cursor:pointer;border-radius:6px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.pw button:hover,.pw button:focus-visible{background:var(--orl);color:var(--or2)}
.lg-opts{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--gr2)}
.lg-opts label{display:flex!important;align-items:center;gap:8px;margin:0!important;cursor:pointer;font-weight:500!important;font-size:13px!important;color:var(--gr2)!important}
.lg-opts input{width:18px!important;height:18px;accent-color:var(--or);padding:0!important}
.imp-file{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:#FAFAFB}
.imp-file .nm{font-weight:700;word-break:break-all}
.imp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.imp-grid div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.imp-grid b{display:block;font-size:18px}
.imp-grid span{font-size:11px;color:var(--mut)}
@media(max-width:600px){.imp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh}
#side{width:236px;background:linear-gradient(180deg,#1C1F24 0%,#23272D 55%,#1C1F24 100%);color:#E5E7EB;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s;border-right:1px solid #2F343B}
#side .brand{padding:18px 14px 14px;border-bottom:1px solid #2F343B;display:flex;flex-direction:column;align-items:stretch;gap:6px;position:relative}
#side .brand::after{content:'';position:absolute;left:24px;right:24px;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--or),transparent)}
.brand-tile{display:flex;justify-content:center}
.brand-tile .logo-img{width:160px;height:106px;background-image:var(--logo-dk)}
#side .brand small{display:block;color:#8B929C;font-size:10.5px;text-align:center;letter-spacing:.12em;text-transform:uppercase}
.logo-img{background:var(--logo) center/contain no-repeat;width:150px;height:100px;flex-shrink:0}
.logo-img.lg{width:220px;height:146px}
.logo-img.hdr{display:none;width:56px;height:38px}
#side nav{flex:1;padding:10px 8px;overflow:auto}
#side nav .sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8B929C;padding:14px 10px 6px}
#side nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#D1D5DB;text-decoration:none;cursor:pointer;margin-bottom:2px}
#side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#side nav a.on{background:linear-gradient(90deg,var(--or),var(--or2));color:#fff;box-shadow:0 4px 12px rgba(18,125,203,.28)}
#side nav a .ic{width:20px;text-align:center}
#side nav a .bdg{margin-left:auto;background:#fff;color:var(--or2);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
#side nav a.on .bdg{color:var(--or)}
#side .user{padding:12px 16px;border-top:1px solid #2F343B;font-size:12px;background:rgba(0,0,0,.15)}
#side .user b{display:block;color:#fff;font-size:13px}
#side .user button{margin-top:8px;width:100%;background:transparent;border:1px solid #3A3F47;color:#D1D5DB;padding:7px;border-radius:6px;cursor:pointer}
#side .user button:hover{border-color:var(--or);color:#fff}
/* ---------- MENU RECOLHÍVEL (computador) ---------- */
#sideTg{display:none}
@media(min-width:901px){
  #sideTg{display:flex;position:absolute;top:118px;right:-13px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);background:var(--or);color:#fff;font-size:15px;font-weight:700;line-height:1;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25);padding:0}
  #sideTg:hover{background:var(--or2)}
  #side,#main{transition:width .2s ease,margin-left .2s ease}
  body.menu-min #side{width:68px}
  body.menu-min #main{margin-left:68px}
  body.menu-min #side .brand{padding:14px 6px 12px}
  body.menu-min #side .brand small{display:none}
  body.menu-min .brand-tile .logo-img{width:52px;height:36px}
  body.menu-min #sideTg{top:54px}
  body.menu-min #side nav{padding:10px 6px}
  body.menu-min #side nav .sec{font-size:0;padding:6px 0;margin:6px 8px;border-top:1px solid #2F343B}
  body.menu-min #side nav a{justify-content:center;padding:11px 0;position:relative}
  body.menu-min #side nav a .lb{display:none}
  body.menu-min #side nav a .ic{width:auto;font-size:17px}
  body.menu-min #side nav a .bdg{position:absolute;top:2px;right:4px;margin:0;font-size:10px;padding:0 5px}
  body.menu-min #side .user{padding:10px 8px}
  body.menu-min #side .user b,body.menu-min #side .user #uPerfil{display:none}
  body.menu-min #side .user button{font-size:0;margin-top:0;padding:8px 0}
  body.menu-min #side .user button::before{content:'⏻';font-size:15px}
}
#main{margin-left:236px;flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 3px 0 0 transparent}
#top::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--or) 0%,var(--or2) 45%,var(--gr) 100%)}
#top h1{color:var(--gr)}
#content{margin-top:3px}
#top h1{font-size:18px;margin:0;flex:1}
#top .emp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
#top select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600}
#burger{display:none;background:none;border:0;font-size:22px;cursor:pointer}
#content{padding:20px;flex:1}
#overlay{display:none}
@media(max-width:900px){
  #side{transform:translateX(-100%)}
  #side.open{transform:none}
  #main{margin-left:0}
  #burger{display:block}
  #overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  #content{padding:14px}
  #top{padding:10px 14px}
  #top .emp span{display:none}
}

/* ---------- COMPONENTES ---------- */
.btn{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--or);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--or2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--or);color:var(--or2)}
.btn.dark{background:var(--gr)}
.btn.dark:hover{background:var(--gr2)}
.btn.ok{background:var(--ok)}
.btn.ok:hover{background:#15803D}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #FCA5A5}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.wa{background:#25D366}
.btn.wa:hover{background:#1DA851}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:4px;height:15px;background:var(--or);border-radius:2px;flex-shrink:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--gr);color:#fff}
.seg button+button{border-left:1px solid var(--line)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:4px solid var(--or)}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.ok{border-left-color:var(--ok)} .kpi.bad{border-left-color:var(--bad)} .kpi.warn{border-left-color:var(--warn)} .kpi.info{border-left-color:var(--info)} .kpi.dk{border-left-color:var(--gr)}
.kpi.click{cursor:pointer} .kpi.click:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kpi.sel{background:var(--orl)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters label{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:130px}
.filters .grow{flex:1;min-width:180px}
.filters .grow input{width:100%}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#FAFAFB;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F3F8FD}
td.num,th.num{text-align:right}
td.act{white-space:nowrap;text-align:right}
tr.hl td{background:#E6F1FB!important;animation:hl 2.5s ease}
@keyframes hl{0%{background:#8CC4EC}100%{background:#E6F1FB}}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#F3F4F6;color:var(--gr2);white-space:nowrap}
.tag.ok{background:var(--okl);color:#166534}.tag.bad{background:var(--badl);color:#991B1B}.tag.warn{background:var(--warnl);color:#92400E}.tag.info{background:var(--infol);color:#1E40AF}.tag.or{background:var(--orl);color:var(--or2)}
.muted{color:var(--mut)} .small{font-size:12px}
.prog{height:8px;background:#EEF0F3;border-radius:6px;overflow:hidden;min-width:90px}
.prog>div{height:100%;background:var(--or);border-radius:6px}
.prog.ok>div{background:var(--ok)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 0}
.empty{padding:36px;text-align:center;color:var(--mut)}
.phone{white-space:nowrap}
.chartbox{position:relative;height:280px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.dayhead{font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--gr2)}
.dayhead.late{color:var(--bad)} .dayhead.today{color:var(--or2)}
.fu{background:#fff;border:1px solid var(--line);border-left:4px solid var(--or);border-radius:10px;padding:12px 14px;display:flex;gap:14px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.fu.late{border-left-color:var(--bad)} .fu.done{border-left-color:var(--ok);opacity:.85} .fu.canc{border-left-color:#9CA3AF;opacity:.7}
.fu .hr{font-weight:700;min-width:48px;color:var(--gr2)}
.fu .bd{flex:1;min-width:200px}
.fu .bd b{font-size:14px}
.fu .ds{color:var(--gr2);margin-top:3px;font-size:13px;white-space:pre-wrap}
.fu .mt{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.fu .ac{display:flex;gap:6px;align-items:center}
.playbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(22,163,74,.35)}
.playbtn:hover{background:#15803D}
.aniv{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.aniv .cake{font-size:26px}
.aniv .bd{flex:1;min-width:200px}
.aniv.done{background:#F6FEF9;border-color:#BBF7D0}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(17,19,23,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.lg{max-width:760px}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mhead h3{margin:0;font-size:16px;flex:1}
.mhead .x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
.mbody{padding:18px 20px;max-height:calc(100vh - 220px);overflow:auto}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form textarea{min-height:80px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,.filters input:focus,.filters select:focus{outline:2px solid #8CC4EC;border-color:var(--or)}
@media(max-width:600px){.form{grid-template-columns:1fr}}
.picker{position:relative}
.picker .res{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:240px;overflow:auto;z-index:5}
.picker .res div{padding:8px 11px;cursor:pointer;border-bottom:1px solid #F3F4F6}
.picker .res div:hover{background:var(--orl)}
.picker .sel{margin-top:6px;font-size:12px;color:var(--ok);font-weight:600}
.callhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.callhead .nm{font-size:18px;font-weight:700}
.phones{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.playzone{text-align:center;background:#F8FAF9;border:1px dashed #BBF7D0;border-radius:14px;padding:20px;margin:14px 0}
.playzone .big{width:84px;height:84px;border-radius:50%;border:0;font-size:32px;color:#fff;background:var(--ok);cursor:pointer;box-shadow:0 6px 18px rgba(22,163,74,.4)}
.playzone .big.stop{background:var(--bad);box-shadow:0 6px 18px rgba(220,38,38,.4);animation:pulse 1.4s infinite}
.playzone .big:disabled{background:#9CA3AF;box-shadow:none;animation:none;cursor:default}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.playzone .tm{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:10px;color:var(--gr)}
.playzone .st{color:var(--mut);font-size:13px;margin-top:4px}
.box-info{background:#F9FAFB;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gr);color:#fff;padding:12px 18px;border-radius:10px;z-index:200;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
#toast.err{background:var(--bad)}
#toast.ok{background:var(--ok)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--gr2);font-weight:600}
#loading.show{display:flex}
.spin{width:38px;height:38px;border:4px solid #C6DFF3;border-top-color:var(--or);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.blocked{max-width:460px;margin:80px auto;text-align:center}
.ck-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff}
.ck-row:hover{border-color:var(--or)}
.ck-row input{width:18px;height:18px;accent-color:var(--or);margin-top:1px;flex-shrink:0}
.form.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
.plCk{width:18px;height:18px;accent-color:var(--or);cursor:pointer}
.plCk:disabled{cursor:not-allowed;opacity:.4}
.tag-x{border:0;background:transparent;color:inherit;cursor:pointer;font-weight:700;font-size:11px;padding:0 0 0 5px;line-height:1}
.tag-x:hover{color:var(--bad)}
.pl-tel{display:flex;gap:6px;flex-wrap:wrap;justify-content:inherit}
.pl-tel input{width:140px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
.pl-tel input:focus{outline:2px solid #8CC4EC;border-color:var(--or)}
.pl-tel input.salvo{border-color:var(--ok);background:#F0FDF4}
@media(max-width:700px){.pl-tel{justify-content:flex-end}}
.pl-bar{position:sticky;bottom:10px;z-index:20;background:#fff;border:1px solid var(--line);border-top:3px solid var(--or);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;box-shadow:0 -4px 16px rgba(0,0,0,.10)}
.pl-bar #plCnt{font-weight:700;font-size:15px}
.pl-bar .btn{margin-left:auto}
@media(max-width:900px){.form.f4{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-bar{bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
@media(max-width:600px){.form.f4{grid-template-columns:1fr}}
.pa-title{background:var(--or);color:#fff;font-weight:800;font-size:22px;letter-spacing:.02em;text-align:center;padding:10px;border-radius:12px 12px 0 0}
.pa-tbl{border-radius:0 0 12px 12px}
.pa-tbl th{background:var(--gr);color:#fff;text-align:center}
.pa-tbl td{text-align:center;font-size:13px}
.pa-tbl td.pa-txt{white-space:pre-wrap;min-width:150px}
.pa-tbl td.act{text-align:right}
.pa-title.conc{background:var(--ok)}
.pa-tbl tr.pa-env td{background:#FFF6E5}
.pa-tbl tr.pa-rec td{background:#E8F2FC}
.pa-tbl tr.pa-eq td{background:#F6F7F9}
.pa-tbl tr.pa-env td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.pa-tbl tr.pa-rec td:first-child{box-shadow:inset 4px 0 0 var(--or)}
.pa-tbl tr.pa-eq td:first-child{box-shadow:inset 4px 0 0 #9CA3AF}
@media(max-width:700px){.pa-tbl tr.pa-env{border-left-color:var(--warn)!important}.pa-tbl tr.pa-eq{border-left-color:#9CA3AF!important}.pa-tbl tr.pa-env td:first-child,.pa-tbl tr.pa-rec td:first-child,.pa-tbl tr.pa-eq td:first-child{box-shadow:none}}
.pa-sw{width:14px!important;height:10px!important;border:1px solid #D1D5DB}
.pa-sw.meu{background:#fff}.pa-sw.env{background:#FFF6E5;border-color:var(--warn)}.pa-sw.rec{background:#E8F2FC;border-color:var(--or)}.pa-sw.eq{background:#F6F7F9}
.pa-quem{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;max-height:210px;overflow:auto}
.pa-quem .ck-row{margin:0}
.pa-bar{position:relative;height:10px;background:#E5E7EB;border-radius:6px;min-width:90px}
.pa-bar-f{height:100%;border-radius:6px;transition:width .4s ease}
.pa-bar i{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--gr);border-radius:1px}
.pa-bar-l{font-size:12px;margin-top:5px;line-height:1.35}
.pa-et{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pa-et input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex-shrink:0}
.pa-et input:not([type]){flex:1}
.pa-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 8px}
.pa-leg span{display:inline-flex;align-items:center;gap:5px}
.pa-leg b{display:inline-block;width:14px;height:8px;border-radius:3px}

/* ---------- SEMANA (arrastar) ---------- */
.wk-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wk-nav .lbl{font-weight:700;color:var(--gr);min-width:170px;text-align:center}
.wk-hint{font-size:12px;color:var(--mut);margin-left:auto}
.wk{display:grid;grid-template-columns:repeat(var(--cols),minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.wk-col{background:#ECEEF1;border-radius:12px;padding:8px;min-height:240px;display:flex;flex-direction:column;gap:8px;border:2px dashed transparent;transition:background .15s,border-color .15s}
.wk-col.today{background:var(--orl)}
.wk-col.late-col{background:var(--badl)}
.wk-col.past .wk-h{opacity:.6}
.wk-col.over{border-color:var(--or);background:#CFE5F7}
.wk-h{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;color:var(--gr2);padding:2px 2px 4px}
.wk-col.today .wk-h{color:var(--or2)} .wk-col.late-col .wk-h{color:var(--bad)}
.wk-h .n{background:#fff;border-radius:10px;padding:1px 7px;font-size:11px}
.wk-empty{font-size:12px;color:#9CA3AF;text-align:center;padding:14px 4px;border:1px dashed #D1D5DB;border-radius:8px}
.wk-card{background:#fff;border-radius:9px;padding:8px 10px;border-left:4px solid var(--or);box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:12.5px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;gap:3px}
.wk-card b{font-size:12.5px;line-height:1.25}
.wk-card .wk-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.wk-card .wk-top .hr{font-weight:700;color:var(--gr2)}
.wk-card .wk-ds{color:var(--gr2);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wk-card .wk-ac{display:flex;justify-content:flex-end;gap:6px;margin-top:4px;align-items:center}
.wk-card .wk-ac .playbtn{width:32px;height:32px;font-size:12px}
.wk-card.late{border-left-color:var(--bad)}
.wk-card.done{border-left-color:var(--ok);opacity:.6;cursor:default}
.wk-card.dragging{opacity:.3}
.wk-ghost{position:fixed;pointer-events:none;z-index:500;transform:rotate(2deg) scale(1.03);box-shadow:0 14px 34px rgba(0,0,0,.28);margin:0}
body.drag-on{cursor:grabbing;user-select:none;-webkit-user-select:none}

  const r = await fetch(CONFIG.SUPABASE_URL+'/auth/v1/'+path, { method:'POST', headers:h, body: JSON.stringify(body||{}) });

function traduzErro(m){

}

  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}

/* ============================ LOGIN / BOOT ============================ */

/* Mostrar senha / Lembrar senha
   A senha é guardada CIFRADA (AES-GCM) neste navegador. A chave de cifra é gerada pelo
   próprio navegador, não pode ser exportada e fica no IndexedDB; no localStorage fica só
   o texto cifrado. Desmarcar "Lembrar senha" apaga o que foi guardado. */
const LEMBRAR_KEY = 'eleve_lig_lembrar';
function alternarSenha(){
  const i = $('lgSenha'), ver = i.type === 'password';
  i.type = ver ? 'text' : 'password'; $('lgRisco').style.display = ver ? '' : 'none';
  $('lgOlho').setAttribute('aria-label', ver ? 'Ocultar senha' : 'Mostrar senha'); $('lgOlho').title = ver ? 'Ocultar senha' : 'Mostrar senha';
}
function chaveLembrar(){
  return new Promise((ok, erro) => {
    const rq = indexedDB.open('eleve_lig', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('k');
    rq.onerror = () => erro(rq.error);
    rq.onsuccess = () => {
      const idb = rq.result, g = idb.transaction('k').objectStore('k').get('lembrar');
      g.onerror = () => erro(g.error);
      g.onsuccess = async () => {
        if(g.result) return ok(g.result);
        try{
          const k = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
          const t = idb.transaction('k','readwrite'); t.objectStore('k').put(k, 'lembrar');
          t.oncomplete = () => ok(k); t.onerror = () => erro(t.error);
        }catch(e){ erro(e); }
      };
    };
  });
}
const b64 = u8 => btoa(String.fromCharCode(...u8));
const deB64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function prepararLogin(){
  let lemb = null; try{ lemb = JSON.parse(localStorage.getItem(LEMBRAR_KEY)); }catch(e){}
  $('lgLembrar').checked = !!lemb;
  if(!lemb || !lemb.email) return;
  $('lgEmail').value = lemb.email;
  if(!lemb.iv || !lemb.ct) return;
  try{
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:deB64(lemb.iv) }, await chaveLembrar(), deB64(lemb.ct));
    $('lgSenha').value = new TextDecoder().decode(pt);
  }catch(e){}
}
async function lembrarAposLogin(email, senha){
  if(!$('lgLembrar').checked){ try{ localStorage.removeItem(LEMBRAR_KEY); }catch(e){} return; }
  try{
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await chaveLembrar(), new TextEncoder().encode(senha)));
    localStorage.setItem(LEMBRAR_KEY, JSON.stringify({ email, iv:b64(iv), ct:b64(ct) }));
  }catch(e){ try{ localStorage.setItem(LEMBRAR_KEY, JSON.stringify({ email })); }catch(x){} }
}

$('loginForm').addEventListener('submit', async ev => {

    $('lgSenha').value = ''; $('lgSenha').type = 'password'; $('lgRisco').style.display = 'none';
    lembrarAposLogin(email, senha);
    await boot();
  }catch(e){ $('loginMsg').textContent = e.message; }
  finally{ $('lgBtn').disabled = false; }
});

async function boot(){

  try{
    const me = (await sbFetch(`/rest/v1/usuarios?id=eq.${S.user.id}&select=*`))[0];

function montarEmpSel(){
  const s = $('empSel'); s.parentElement.classList.remove('hidden');

const PAGES = {
  painel:{ t:'Painel de Metas', ic:'📊', fn:()=>pgPainel() },
  aniversariantes:{ t:'Aniversariantes', ic:'🎂', fn:()=>pgAniv() },
  planejamento:{ t:'Planejamento (Follow-up)', ic:'📅', fn:()=>pgPlan() },
  planejar:{ t:'Planejar Ligações', ic:'📋', fn:()=>pgPlanejar() },
  ligacoes:{ t:'Ligações Realizadas', ic:'✅', fn:()=>pgLig() },
  clientes:{ t:'Clientes', ic:'👥', fn:()=>pgCli() },
  plano:{ t:'Plano de Ação', ic:'🎯', fn:()=>pgPlano() },
  planoconc:{ t:'Planos Concluídos', ic:'🏁', fn:()=>pgPlano(), seg:'plano' },
  vendedoras:{ t:'Vendedoras', ic:'👩‍💼', fn:()=>pgVend(), extra:true },
  empresas:{ t:'Empresas', ic:'🏢', fn:()=>pgEmp(), adm:true },
  usuarios:{ t:'Usuários / Acessos', ic:'🔑', fn:()=>pgUsu(), adm:true },
  perfis:{ t:'Perfis de Acesso', ic:'🧩', fn:()=>pgPerfis(), adm:true },
  permissoes:{ t:'Permissões de Telas', ic:'🛡️', fn:()=>pgPerm(), adm:true },
  meuperfil:{ t:'Meu Perfil', ic:'👤', fn:()=>pgMeuPerfil(), livre:true }
};
/* Permissões de telas: usuarios.telas (null = todas as telas de operação liberadas) */
const TELAS_OPER = ['painel','aniversariantes','planejamento','planejar','ligacoes','clientes','plano'];
/* Telas extras: só liberadas quando marcadas explicitamente em Permissões (ex.: caixa cadastrar vendedoras) */
const TELAS_PERM = [...TELAS_OPER, 'vendedoras'];
/* Telas que funcionam sem vendedora vinculada (ex.: gerente) */
const SEM_VINC = ['plano', 'vendedoras'];
function pode(k){
  if(!PAGES[k]) return false;
  if(PAGES[k].seg) return pode(PAGES[k].seg);
  if(PAGES[k].livre) return true;
  if(isAdmin()) return true;
  if(PAGES[k].adm) return false;
  if(TELAS_OPER.includes(k) && !SEM_VINC.includes(k) && !minhas().length) return false;
  const t = telasDe(db.me);
  if(PAGES[k].extra) return Array.isArray(t) && t.includes(k);
  return !Array.isArray(t) || t.includes(k);
}
function montarNav(){
  const nAniv = anivDoDia(hoje()).length;
  const nAtras = fuVisiveis().filter(f => f.status==='pendente' && f.data_prevista <= hoje()).length;
  const item = (k, bdg) => !pode(k) ? '' : `<a class="${st.page===k?'on':''}" title="${PAGES[k].t}" onclick="ir('${k}')"><span class="ic">${PAGES[k].ic}</span><span class="lb">${PAGES[k].t}</span>${bdg?`<span class="bdg">${bdg}</span>`:''}</a>`;
  let h = (TELAS_OPER.some(pode) ? '<div class="sec">Operação</div>' : '') + item('painel') + item('aniversariantes', nAniv||'') + item('planejamento', nAtras||'') + item('planejar') + item('ligacoes') + item('clientes') + item('plano', paPend().length||'') + item('planoconc');
  const cad = item('vendedoras') + item('empresas') + item('usuarios') + item('perfis') + item('permissoes');
  if(cad) h += '<div class="sec">Cadastros</div>' + cad;
  h += '<div class="sec">Conta</div>' + item('meuperfil');
  $('nav').innerHTML = h;
  $('bnav').innerHTML = [['painel','Painel'],['aniversariantes','Aniversários',nAniv],['planejamento','Follow-up',nAtras],['ligacoes','Ligações'],['clientes','Clientes']].filter(([k]) => pode(k))
    .map(([k,l,b]) => `<a class="${st.page===k?'on':''}" onclick="ir('${k}')"><span class="ic">${PAGES[k].ic}</span>${l}${b?`<span class="bdg">${b}</span>`:''}</a>`).join('');
}
function ir(p){
  if(!pode(p)){
    if($('content').innerHTML && pode(st.page) && PAGES[p]) return toast('Você não tem acesso a essa tela.', 'err');
    p = [...TELAS_PERM, 'meuperfil'].find(pode);
    if(!p){ bloqueado('Nenhuma tela foi liberada para o seu usuário. Fale com o administrador.'); return; }
  }
  st.page = p; st.charts.forEach(c => c.destroy()); st.charts = [];
  $('pgTitle').textContent = PAGES[p].t; montarNav(); toggleSide(false);
  PAGES[p].fn(); window.scrollTo(0,0);
}
function toggleSide(on){ $('side').classList.toggle('open', on); $('overlay').classList.toggle('show', on); }

/* ============================ MODAL ============================ */
let modalOnClose = null;
function abrirModal(titulo, corpo, rodape, lg, onClose){
  $('mbox').className = 'mbox' + (lg ? ' lg' : '');
  $('mbox').innerHTML = `<div class="mhead"><h3>${titulo}</h3><button class="x" onclick="fecharModal()">×</button></div><div class="mbody">${corpo}</div>${rodape?`<div class="mfoot">${rodape}</div>`:''}`;
  $('modal').classList.add('show'); modalOnClose = onClose || null;
}
function fecharModal(forcar){
  if(!forcar && modalOnClose && modalOnClose() === false) return;
  $('modal').classList.remove('show'); modalOnClose = null;
}
$('modal').addEventListener('mousedown', e => { if(e.target.id === 'modal') fecharModal(); });

/* ============================ FILTROS COMUNS ============================ */
function fuVisiveis(){ return db.followups.filter(f => empOk(f.empresa_id) && (isAdmin() || minhas().includes(f.vendedora_id))); }
function ligVisiveis(){ return db.ligacoes.filter(l => empOk(l.empresa_id) && (isAdmin() || minhas().includes(l.vendedora_id))); }
function cliVisiveis(){ return db.clientes.filter(c => empOk(c.empresa_id)); }
function vendOptions(sel, todasLabel, empId){
  let l = vendsVisiveis(); if(empId) l = l.filter(v => v.empresa_id === Number(empId));
  return (todasLabel ? `<option value="">${todasLabel}</option>` : '') + l.map(v => `<option value="${v.id}" ${String(sel)===String(v.id)?'selected':''}>${esc(v.nome)}${curEmp()?'':' · '+esc(empNome(v.empresa_id))}${v.ativa?'':' (inativa)'}</option>`).join('');
}

/* ============================ ANIVERSARIANTES ============================ */
function mmdd(iso){ return iso ? iso.slice(5,10) : ''; }
function anivDoDia(iso, filtrar){
  const alvo = iso.slice(5,10); const ano = Number(iso.slice(0,4));
  const bissexto = (ano%4===0 && ano%100!==0) || ano%400===0;
  return cliVisiveis().filter(c => { if(!c.data_nascimento || !c.ativo) return false;
    if(filtrar && ((st.aniv.emp && c.empresa_id !== Number(st.aniv.emp)) || !clsOk(c.id, st.aniv.cls))) return false;
    const md = mmdd(c.data_nascimento); return md === alvo || (!bissexto && md === '02-29' && alvo === '02-28'); });
}
function ligouHoje(cid){ const h = hoje(); return db.ligacoes.find(l => l.cliente_id === cid && dataDeTs(l.inicio) === h); }
function idadeEm(c, iso){ return Number(iso.slice(0,4)) - Number(c.data_nascimento.slice(0,4)); }

function anivItem(c, iso){
  const lig = iso === hoje() ? ligouHoje(c.id) : null;
  return `<div class="aniv ${lig?'done':''}">
    <div class="cake">${lig?'✅':'🎂'}</div>
    <div class="bd"><b>${esc(c.nome)}</b> ${empTag(c.empresa_id)} ${clsTag(c)}
      <div class="small muted">${fmtDM(c.data_nascimento)} · faz ${idadeEm(c, iso)} anos ${lig?` · <span class="tag ok">Ligação feita às ${fmtDH(lig.inicio).slice(11)} por ${esc(vendNome(lig.vendedora_id))}</span>`:''}</div>
      <div class="small muted">${[c.celular, c.telefone].filter(Boolean).map(esc).join(' · ') || 'Sem telefone'}</div>
    </div>
    <div class="ac" style="display:flex;gap:6px">

/* Mensagem de aniversário: nome da cliente, da vendedora e da loja (empresa da cliente) */
const MIN_PAL = ['de','da','do','das','dos','e'];
const tituloNome = s => String(s||'').toLowerCase().split(/\s+/).filter(Boolean).map((w,i) => i && MIN_PAL.includes(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
const primeiroNome = s => tituloNome(String(s||'').trim().split(/\s+/)[0]);
const saudacao = () => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; };
function foneWa(c){ const p = [c.celular, c.telefone].find(ehCelular) || c.celular || c.telefone; return p ? discar(p) : ''; }

    `🎉 A ${loja} deseja a você um feliz aniversário! 🥳\n\n` +

}

}

function cartaoDe(c){ const n = normNome(empNome(c.empresa_id)).replace(/[^A-Z]/g,''); const k = Object.keys(CARTOES).find(k => n.includes(k)); return k ? CARTOES[k] : null; }
function dataUrlBlob(u){ const [h, b] = u.split(','), bin = atob(b), a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: h.match(/data:(.*?);/)[1] }); }
function pngDoCartao(u){ return new Promise((ok, erro) => { const im = new Image(); im.onload = () => { const cv = document.createElement('canvas'); cv.width = im.naturalWidth; cv.height = im.naturalHeight; cv.getContext('2d').drawImage(im, 0, 0); cv.toBlob(b => b ? ok(b) : erro(new Error('png')), 'image/png'); }; im.onerror = erro; im.src = u; }); }
function baixarCartao(cid){ const u = cartaoDe(M.cli[cid]); if(!u) return; const a = document.createElement('a'); a.href = u; a.download = 'cartao-aniversario.jpg'; document.body.appendChild(a); a.click(); a.remove(); }
/* Celular: abre o compartilhar com cartão + mensagem (escolher WhatsApp e a cliente).
   Computador: copia o cartão e abre a conversa da cliente com a mensagem — é só colar (Ctrl+V) o cartão. */
function enviarAniv(c, texto){
  const f = foneWa(c); if(!f){ toast('Cliente sem telefone cadastrado.', 'err'); return false; }
  const card = cartaoDe(c), url = `https://wa.me/55${f}?text=${encodeURIComponent(texto)}`;
  if(card && window.matchMedia('(pointer:coarse)').matches && navigator.canShare){
    const file = new File([dataUrlBlob(card)], 'cartao-aniversario.jpg', { type:'image/jpeg' });
    if(navigator.canShare({ files:[file] })){
      try{ navigator.clipboard && navigator.clipboard.writeText(texto).catch(()=>{}); }catch(e){}
      navigator.share({ files:[file], text:texto }).catch(e => { if(e.name !== 'AbortError') window.location.href = url; });
      return true;
    }
  }
  if(card && navigator.clipboard && window.ClipboardItem){
    try{ navigator.clipboard.write([new ClipboardItem({ 'image/png': pngDoCartao(card) })])
      .then(() => toast('Cartão copiado! Na conversa do WhatsApp, cole com Ctrl+V e envie junto com a mensagem.', 'ok'))
      .catch(() => toast('Não consegui copiar o cartão. Use “Baixar cartão” e anexe na conversa.', 'err')); }catch(e){}
  }
  window.open(url, '_blank', 'noopener');
  return true;
}
function abrirWa(c, vid){
  if(!vid) return toast('Selecione a vendedora.', 'err'), false;

function pgAniv(){
  const a = st.aniv, t = a.tab, h = hoje(), anoAt = new Date().getFullYear();
  let dias = [];
  if(t === 'hoje') dias = [h];
  else if(t === '7') for(let i=1;i<=7;i++) dias.push(addDias(h,i));
  else { const y = Number(a.ano), m = Number(a.mes), last = new Date(y,m,0).getDate(); if(Number(a.dia) > last) a.dia = '';
    if(a.dia) dias.push(y+'-'+pad(m)+'-'+pad(a.dia)); else for(let d=1; d<=last; d++) dias.push(y+'-'+pad(m)+'-'+pad(d)); }
  const empF = !curEmp()
    ? `<div class="f"><label>Empresa</label><select onchange="st.aniv.emp=this.value;pgAniv()"><option value="">Todas</option>${db.empresas.filter(e=>e.ativo && empOk(e.id)).map(e=>`<option value="${e.id}" ${String(a.emp)===String(e.id)?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>`
    : `<div class="f"><label>Empresa</label><select disabled><option>${esc(empNome(curEmp()))}</option></select></div>`;
  let html = `<div class="tabs">
    <button class="${t==='hoje'?'on':''}" onclick="st.aniv.tab='hoje';pgAniv()">Hoje (${anivDoDia(h,true).length})</button>
    <button class="${t==='7'?'on':''}" onclick="st.aniv.tab='7';pgAniv()">Próximos 7 dias</button>
    <button class="${t==='mes'?'on':''}" onclick="st.aniv.tab='mes';pgAniv()">${a.dia?pad(a.dia)+' de ':''}${MESES[Number(a.mes)-1]}/${a.ano}</button>
    <button class="btn sec" style="margin-left:auto" onclick="pdfAniv()">📄 Gerar PDF</button></div>
  <div class="filters">${empF}${clsFiltro(a.cls, "st.aniv.cls=this.value;pgAniv()")}
    <div class="f"><label>Dia</label><select onchange="st.aniv.dia=this.value;st.aniv.tab='mes';pgAniv()"><option value="">Todos</option>${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${String(a.dia)===String(d)?'selected':''}>${pad(d)}</option>`).join('')}</select></div>
    <div class="f"><label>Mês</label><select onchange="st.aniv.mes=this.value;st.aniv.tab='mes';pgAniv()">${MESES.map((m,i)=>`<option value="${pad(i+1)}" ${a.mes===pad(i+1)?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="f"><label>Ano</label><select onchange="st.aniv.ano=Number(this.value);st.aniv.tab='mes';pgAniv()">${[anoAt-1,anoAt,anoAt+1].map(y=>`<option ${Number(a.ano)===y?'selected':''}>${y}</option>`).join('')}</select></div>
  </div>`;
  let total = 0; st.pdfAniv = [];
  dias.forEach(d => {
    const l = anivDoDia(d, true); if(!l.length) return; total += l.length;
    l.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(c => st.pdfAniv.push({ d, c }));
    const feitos = d === h ? l.filter(c => ligouHoje(c.id)).length : 0;
    html += `<div class="dayhead ${d===h?'today':''}">${d===h?'Hoje · ':''}${nomeDia(d)} ${fmtD(d)} <span class="tag">${l.length}</span>${d===h?` <span class="tag ok">${feitos} ligada(s)</span>`:''}</div>`;
    html += l.sort((a,b) => (d===h ? (!!ligouHoje(a.id) - !!ligouHoje(b.id)) : 0) || a.nome.localeCompare(b.nome)).map(c => anivItem(c, d)).join('');
  });
  if(!total) html += '<div class="card empty">Nenhuma cliente fazendo aniversário neste período.</div>';
  $('content').innerHTML = html;
}

const rotulosPlugin = { id:'rotulos', afterDatasetsDraw(ch, args, opt){
  if(!opt || !opt.on) return;
  const ctx = ch.ctx, tipo = ch.config.type, fmt = opt.fmt || fmtDec, ys = ch.options.scales && ch.options.scales.y, stacked = !!(ys && ys.stacked);
  ctx.save(); ctx.font = "600 11px 'Segoe UI',system-ui,Arial,sans-serif"; ctx.textAlign = 'center';
  ch.data.datasets.forEach((ds, i) => {
    if(!ch.isDatasetVisible(i)) return; const m = ch.getDatasetMeta(i);
    if(tipo === 'doughnut'){
      const tot = ds.data.reduce((a,b) => a+(b||0), 0);
      m.data.forEach((el, j) => { const v = ds.data[j]; if(!v || !tot || v/tot < .05) return; const p = el.tooltipPosition();
        ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(fmtN(v)+' · '+Math.round(v/tot*100)+'%', p.x, p.y); });
      return;
    }
    if(tipo === 'line'){
      let j = ds.data.length-1; while(j >= 0 && (ds.data[j] === null || ds.data[j] === undefined)) j--;
      if(j < 0 || (opt.max && i >= opt.max)) return; const el = m.data[j];
      ctx.fillStyle = ds.borderColor; ctx.textBaseline = 'bottom'; ctx.textAlign = el.x > ch.chartArea.right-30 ? 'right' : 'center';
      ctx.fillText(fmt(ds.data[j]), el.x, el.y-6); ctx.textAlign = 'center';
      return;
    }
    m.data.forEach((el, j) => { const v = ds.data[j]; if(!v) return;
      if(stacked){ if(Math.abs(el.base-el.y) < 14) return; ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(fmt(v), el.x, (el.y+el.base)/2); }

  const empsN = db.empresas.filter(e => e.ativo && (isAdmin() || minhasEmps().includes(e.id)));
  const baseN = db.clientes.filter(c => c.data_cadastro && c.data_cadastro.slice(0,4) === String(anoN) && clsOk(c.id, p.cls));
  st.charts.push(new Chart($('ch5'), { type:'bar', data:{ labels: MESES.map(m => m.slice(0,3)+'/'+String(anoN).slice(2)), datasets: empsN.map(e => ({ label:e.nome, backgroundColor:e.cor||'#127DCB', borderRadius:4, maxBarThickness:34,
      data: MESES.map((_,i) => baseN.filter(c => c.empresa_id === e.id && c.data_cadastro.slice(5,7) === pad(i+1)).length) })) },
    options:{ maintainAspectRatio:false, layout:pad20, plugins:{ rotulos:{ on:true, fmt:fmtN } }, scales:{ y:{ beginAtZero:true, grace:'10%', ticks:{ precision:0 } } } } }));
}

/* ============================ PLANEJAMENTO (FOLLOW-UP) ============================ */
function pgPlan(){
  const p = st.plan, h = hoje(), f7 = addDias(h,7), comp = mesAtual();
  const base = fuVisiveis().filter(f => (!p.vend || String(f.vendedora_id) === String(p.vend)) && clsOk(f.cliente_id, p.cls));
  const cnt = {
    atrasados: base.filter(f => f.status==='pendente' && f.data_prevista < h).length,
    hoje: base.filter(f => f.status==='pendente' && f.data_prevista === h).length,
    semana: base.filter(f => f.status==='pendente' && f.data_prevista > h && f.data_prevista <= f7).length,
    concluidos: base.filter(f => f.status==='concluido' && f.concluido_em && dataDeTs(f.concluido_em).slice(0,7) === comp).length
  };
  const q = p.q.trim().toLowerCase();
  let l = base.filter(f => {
    switch(p.filtro){
      case 'ate_hoje': return f.status==='pendente' && f.data_prevista <= h;
      case 'atrasados': return f.status==='pendente' && f.data_prevista < h;
      case 'hoje': return f.status==='pendente' && f.data_prevista === h;
      case 'semana': return f.status==='pendente' && f.data_prevista > h && f.data_prevista <= f7;
      case 'pendentes': return f.status==='pendente';
      case 'concluidos': return f.status==='concluido';
      case 'cancelados': return f.status==='cancelado';
    } return true;
  });
  if(q) l = l.filter(f => { const c = M.cli[f.cliente_id]||{}; return (c.nome||'').toLowerCase().includes(q) || (f.descricao||'').toLowerCase().includes(q) || discar(c.celular).includes(q) || discar(c.telefone).includes(q); });
  const desc = ['concluidos','cancelados'].includes(p.filtro);
  l.sort((a,b) => desc ? (b.data_prevista.localeCompare(a.data_prevista) || (b.hora||'').localeCompare(a.hora||'')) : (a.data_prevista.localeCompare(b.data_prevista) || (a.hora||'99').localeCompare(b.hora||'99')));
  st.pdfPlan = { itens: l.slice(), desc: ({ate_hoje:'Pendentes até hoje',atrasados:'Atrasados',hoje:'Hoje',semana:'Próximos 7 dias',pendentes:'Todos os pendentes',concluidos:'Concluídos',cancelados:'Cancelados'})[p.filtro] };
  const lim = 300, total = l.length; l = l.slice(0, lim);
  const card = (k, lb, cls, n) => `<div class="kpi ${cls} click ${p.filtro===k?'sel':''}" onclick="st.plan.filtro='${k}';st.plan.view='lista';pgPlan()"><div class="l">${lb}</div><div class="v">${n}</div></div>`;
  const kpis = `<div class="kpis">${card('atrasados','Atrasados','bad',cnt.atrasados)}${card('hoje','Para hoje','',cnt.hoje)}${card('semana','Próximos 7 dias','info',cnt.semana)}${card('concluidos','Concluídos no mês','ok',cnt.concluidos)}</div>`;
  if(p.view === 'semana') return pgPlanSemana(base, kpis);
  let html = kpis + `
  <div class="filters">
    <div class="f"><label>Exibir</label><select onchange="st.plan.filtro=this.value;pgPlan()">
      ${[['ate_hoje','Pendentes até hoje'],['atrasados','Atrasados'],['hoje','Hoje'],['semana','Próximos 7 dias'],['pendentes','Todos os pendentes'],['concluidos','Concluídos'],['cancelados','Cancelados']].map(([v,t])=>`<option value="${v}" ${p.filtro===v?'selected':''}>${t}</option>`).join('')}</select></div>
    ${verVendFiltro()?`<div class="f"><label>Vendedora</label><select onchange="st.plan.vend=this.value;pgPlan()">${vendOptions(p.vend,'Todas')}</select></div>`:''}
    ${clsFiltro(p.cls, "st.plan.cls=this.value;pgPlan()")}
    <div class="f grow"><label>Buscar</label><input id="planQ" value="${esc(p.q)}" placeholder="Cliente, telefone ou descrição" oninput="st.plan.q=this.value;clearTimeout(window._pq);window._pq=setTimeout(()=>{pgPlan();const i=$('planQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div>
    ${planToggle()}
    <button class="btn sec" onclick="pdfPlan()">📄 Gerar PDF</button>
    <button class="btn sec" onclick="ir('planejar')">📋 Planejar em lote</button>
    <button class="btn" onclick="abrirFollowup({})">+ Novo follow-up</button>
  </div>`;
  if(!l.length) html += '<div class="card empty">Nenhum follow-up neste filtro.</div>';
  let dia = null;
  l.forEach(f => {
    if(f.data_prevista !== dia){ dia = f.data_prevista; const late = f.status==='pendente' && dia < h; html += `<div class="dayhead ${late?'late':dia===h?'today':''}">${dia===h?'Hoje · ':late?'Atrasado · ':''}${nomeDia(dia)} ${fmtD(dia)}</div>`; }
    const c = M.cli[f.cliente_id] || {}, late = f.status==='pendente' && f.data_prevista < h;
    const stTag = f.status==='concluido' ? '<span class="tag ok">Concluído</span>' : f.status==='cancelado' ? '<span class="tag">Cancelado</span>' : late ? '<span class="tag bad">Atrasado</span>' : '<span class="tag warn">Pendente</span>';
    html += `<div class="fu ${f.status==='concluido'?'done':f.status==='cancelado'?'canc':late?'late':''}">
      <div class="hr">${f.hora ? f.hora.slice(0,5) : '--:--'}</div>
      <div class="bd"><b>${esc(c.nome||'(cliente)')}</b> ${clsTag(c)} <span class="tag or">${esc(f.motivo)}</span> ${stTag} ${curEmp()?'':empTag(f.empresa_id)}
        ${f.descricao?`<div class="ds">${esc(f.descricao)}</div>`:''}
        <div class="mt"><span>👩‍💼 ${esc(vendNome(f.vendedora_id))}</span><span class="phone">📞 ${esc([c.celular,c.telefone].filter(Boolean).join(' · ')||'sem telefone')}</span>${f.status==='concluido'&&f.concluido_em?`<span>✔ ${fmtDH(f.concluido_em)}</span>`:''}</div></div>
      <div class="ac">
        ${f.status==='pendente' ? `<button class="btn sec sm" onclick="abrirFollowup({id:${f.id}})">✎ Editar</button><button class="btn danger sm" onclick="cancelarFU(${f.id})">✕</button><button class="playbtn" title="Iniciar ligação" onclick="abrirLigacao({followupId:${f.id}})">▶</button>`
          : f.ligacao_id ? `<button class="btn sec sm" onclick="st.hlLig=${f.ligacao_id};st.lig.de='';st.lig.ate='';ir('ligacoes')">Ver ligação</button>` : ''}
      </div></div>`;
  });
  if(total > lim) html += `<p class="muted small">Exibindo ${lim} de ${total}. Use os filtros para refinar.</p>`;
  $('content').innerHTML = html;
}

/* ============================ PLANEJAR LIGAÇÕES (vários clientes de uma vez) ============================ */
function ehAniv(c, iso){
  if(!c.data_nascimento) return false;
  const alvo = iso.slice(5,10), ano = Number(iso.slice(0,4)), bis = (ano%4===0 && ano%100!==0) || ano%400===0, md = c.data_nascimento.slice(5,10);
  return md === alvo || (!bis && md === '02-29' && alvo === '02-28');
}
function pgPlanejar(){
  const p = st.pl, vs = vendsVisiveis(true);
  if(p.vend && !vs.some(x => String(x.id) === String(p.vend))){ p.vend = ''; p.sel = new Set(); }
  if(!p.vend && vs.length === 1) p.vend = String(vs[0].id);
  const v = p.vend ? M.vend[Number(p.vend)] : null;
  let html = `<div class="card" style="margin-bottom:14px"><h3>1. O que agendar</h3><div class="form f4">

    <div><label>Data da ligação *</label><input type="date" value="${p.data}" onchange="st.pl.data=this.value||hoje();pgPlanejar()"></div>
    <div><label>Hora (opcional)</label><input type="time" value="${p.hora}" onchange="st.pl.hora=this.value"></div>
    <div><label>Motivo</label><select onchange="st.pl.motivo=this.value">${MOTIVOS.map(m=>`<option ${p.motivo===m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="full"><label>Descrição / o que falar</label><input value="${esc(p.desc)}" oninput="st.pl.desc=this.value" placeholder="Vale para todos os clientes marcados"></div>
  </div></div>`;
  if(!v){ $('content').innerHTML = html + '<div class="card empty">Selecione a vendedora para listar os clientes da empresa dela.</div>'; return; }
  const q = p.q.trim().toLowerCase(), qd = q.replace(/\D/g,''), nome = (a,b) => a.nome.localeCompare(b.nome);
  const cl = db.clientes.filter(c => c.ativo && c.empresa_id === v.empresa_id && clsOk(c.id, p.cls)
    && (!p.cart || (p.cart === 'dela' ? c.vendedora_id === v.id : !c.vendedora_id))
    && (!p.ped || String(c.numero_pedido||'').toLowerCase().includes(p.ped.trim().toLowerCase()))
    && (!p.entDe || (c.data_entrega && c.data_entrega >= p.entDe)) && (!p.entAte || (c.data_entrega && c.data_entrega <= p.entAte))
    && (!q || c.nome.toLowerCase().includes(q) || (qd.length >= 4 && (discar(c.celular).includes(qd) || discar(c.telefone).includes(qd)))));
  const pend = {}; fuVisiveis().filter(f => f.status === 'pendente').sort((a,b) => a.data_prevista.localeCompare(b.data_prevista)).forEach(f => (pend[f.cliente_id] = pend[f.cliente_id] || []).push(f));
  p.bloq = new Set(Object.keys(pend).map(Number).filter(cid => pend[cid].some(f => f.vendedora_id !== v.id)));
  p.bloq.forEach(cid => p.sel.delete(cid));
  const lim = 200, s3all = cl.slice().sort(nome), s3 = s3all.slice(0, lim);
  const row = (c, extra) => { const u = M.ultLig[c.id], pl = pend[c.id] || [], bl = p.bloq.has(c.id);
    return `<tr><td style="width:40px"><input type="checkbox" class="plCk" data-id="${c.id}" ${p.sel.has(c.id)?'checked':''} ${bl?'disabled title="Já agendado para outra vendedora. Desmarque no ✕ para liberar."':''} onchange="plMarcar(${c.id}, this.checked)"></td>
      <td><b>${esc(c.nome)}</b> ${clsTag(c)} ${extra||''}${pl.map(f => ` <span class="tag ${f.vendedora_id===v.id?'warn':'bad'}" title="Follow-up pendente">📅 ${fmtDM(f.data_prevista)} · ${esc(vendNome(f.vendedora_id))}<button class="tag-x" title="Desmarcar da vendedora (cancela este follow-up)" onclick="plDesmarcarFU(${f.id})">✕</button></span>`).join('')}</td>
      <td class="phone"><div class="pl-tel"><input value="${esc(c.celular||'')}" placeholder="Celular" title="Celular — altere e tecle Enter ou saia do campo para salvar" onchange="plSalvarTel(${c.id},'celular',this)"><input value="${esc(c.telefone||'')}" placeholder="Telefone" title="Telefone — altere e tecle Enter ou saia do campo para salvar" onchange="plSalvarTel(${c.id},'telefone',this)"></div></td>
      <td>${c.numero_pedido?'<b>'+esc(c.numero_pedido)+'</b>':'<span class="muted">—</span>'}${c.data_pedido?'<div class="small muted">'+fmtD(c.data_pedido)+'</div>':''}</td>
      <td>${c.data_entrega?fmtD(c.data_entrega):'<span class="muted">—</span>'}</td>
      <td>${c.data_nascimento?fmtD(c.data_nascimento):'<span class="muted">—</span>'}</td>
      <td class="small">${u?fmtDH(u.inicio)+'<br><span class="muted">'+esc(u.resultado)+'</span>':'<span class="muted">—</span>'}</td>
      <td class="small">${c.vendedora_id?esc(vendNome(c.vendedora_id)):'<span class="muted">—</span>'}</td></tr>`; };
  const secao = (tit, cls, ids, linhas, obs) => `<div class="dayhead ${cls}">${tit} <span class="tag">${ids.length}</span>
      ${ids.length?`<button class="btn sec sm" onclick="plMarcarVarios([${ids.join(',')}],true)">Marcar todos</button><button class="btn sec sm" onclick="plMarcarVarios([${ids.join(',')}],false)">Desmarcar</button>`:''}</div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Cliente</th><th>Celular / Telefone</th><th>Nº pedido</th><th>Entrega</th><th>Nascimento</th><th>Última ligação</th><th>Carteira</th></tr></thead><tbody>${linhas || '<tr><td colspan="8" class="empty">Nenhum cliente.</td></tr>'}</tbody></table></div>${obs||''}`;
  html += `<div class="card"><h3>2. Escolha os clientes · ${esc(empNome(v.empresa_id))}</h3>
    <div class="filters">
      <div class="f grow"><label>Buscar</label><input id="plQ" value="${esc(p.q)}" placeholder="Nome ou telefone" oninput="st.pl.q=this.value;clearTimeout(window._plq);window._plq=setTimeout(()=>{pgPlanejar();const i=$('plQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div>
      ${clsFiltro(p.cls, "st.pl.cls=this.value;pgPlanejar()")}
      <div class="f"><label>Carteira</label><select onchange="st.pl.cart=this.value;pgPlanejar()"><option value="">Todas</option><option value="dela" ${p.cart==='dela'?'selected':''}>Da vendedora</option><option value="sem" ${p.cart==='sem'?'selected':''}>Sem carteira</option></select></div>
      <div class="f"><label>Nº do pedido</label><input id="plPed" value="${esc(p.ped||'')}" placeholder="Ex.: 12345" style="min-width:110px" oninput="st.pl.ped=this.value;clearTimeout(window._plp);window._plp=setTimeout(()=>{pgPlanejar();const i=$('plPed');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div>
      <div class="f"><label>Entrega de</label><input type="date" value="${p.entDe||''}" onchange="st.pl.entDe=this.value;pgPlanejar()"></div>
      <div class="f"><label>Entrega até</label><input type="date" value="${p.entAte||''}" onchange="st.pl.entAte=this.value;pgPlanejar()"></div>
      <button class="btn sec" onclick="plMarcarVarios([],false,true)">Limpar seleção</button>
    </div>
    ${secao('📞 Follow-ups', '', s3.map(c => c.id), s3.map(c => row(c)).join(''), s3all.length > lim ? `<p class="muted small">Exibindo ${lim} de ${fmtN(s3all.length)}. Use a busca ou os filtros para achar os demais.</p>` : '')}
  </div>
  <div class="pl-bar"><span id="plCnt"></span><span class="small muted" id="plInfo"></span><button class="btn" id="plOk" onclick="plCriar()">Criar follow-ups</button></div>`;
  $('content').innerHTML = html; plAtualizar();
}
async function plSalvarTel(id, campo, el){
  const c = M.cli[id], val = el.value.trim() || null;
  if(!c || (c[campo] || null) === val) return;
  el.disabled = true;
  try{
    Object.assign(c, await api.upd('clientes', id, { [campo]: val }));
    el.classList.add('salvo'); toast(`${campo === 'celular' ? 'Celular' : 'Telefone'} de ${c.nome} salvo.`, 'ok');
  }catch(e){ el.value = c[campo] || ''; toast(e.message, 'err'); }
  finally{ el.disabled = false; }
}
function plAtualizar(){
  const p = st.pl, v = M.vend[Number(p.vend)], n = p.sel.size; if(!$('plCnt')) return;
  $('plCnt').textContent = `${fmtN(n)} cliente(s) marcado(s)`;
  $('plInfo').textContent = n && v ? `para ${v.nome} em ${fmtD(p.data)}` : '';
  $('plOk').disabled = !n; $('plOk').textContent = n ? `Criar ${fmtN(n)} follow-up(s)` : 'Criar follow-ups';
}
function plMarcar(id, on){ if(on) st.pl.sel.add(id); else st.pl.sel.delete(id); plAtualizar(); }
async function plDesmarcarFU(fid){
  const f = db.followups.find(x => x.id === fid); if(!f) return;
  if(!confirm(`Desmarcar ${cliNome(f.cliente_id)} da vendedora ${vendNome(f.vendedora_id)}?\nO follow-up de ${fmtD(f.data_prevista)} será cancelado e o cliente fica livre para outra vendedora.`)) return;
  try{ Object.assign(f, await api.upd('followups', fid, { status:'cancelado' })); montarNav(); pgPlanejar(); toast(`${cliNome(f.cliente_id)} desmarcado de ${vendNome(f.vendedora_id)}.`, 'ok'); }
  catch(e){ toast(e.message, 'err'); }
}
function plMarcarVarios(ids, on, tudo){
  if(on) ids = ids.filter(id => !(st.pl.bloq && st.pl.bloq.has(id)));
  if(tudo) st.pl.sel = new Set(); else ids.forEach(id => on ? st.pl.sel.add(id) : st.pl.sel.delete(id));
  document.querySelectorAll('.plCk').forEach(i => { if(tudo || ids.includes(Number(i.dataset.id))) i.checked = !tudo && on; });
  plAtualizar();
}
async function plCriar(){
  const p = st.pl, v = M.vend[Number(p.vend)];
  if(!v) return toast('Selecione a vendedora.', 'err');
  if(!p.data) return toast('Informe a data.', 'err');
  const ids = [...p.sel].filter(id => M.cli[id] && M.cli[id].empresa_id === v.empresa_id && !(p.bloq && p.bloq.has(id)));
  if(!ids.length) return toast('Marque pelo menos um cliente.', 'err');
  ids.sort((a,b) => ehAniv(M.cli[b], p.data) - ehAniv(M.cli[a], p.data) || M.cli[a].nome.localeCompare(M.cli[b].nome));
  const rows = ids.map(id => ({ empresa_id:v.empresa_id, cliente_id:id, vendedora_id:v.id, data_prevista:p.data, hora:p.hora || null,
    motivo: p.motivo, descricao: p.desc.trim() || null }));
  $('plOk').disabled = true; $('plOk').textContent = 'Criando…';
  try{
    for(let i = 0; i < rows.length; i += 500){
      const r = await sbFetch('/rest/v1/followups', { method:'POST', body:rows.slice(i, i+500), headers:{ Prefer:'return=representation' } });
      (r||[]).forEach(f => db.followups.push(f));
    }
    p.sel = new Set(); montarNav(); pgPlanejar();
    toast(`${fmtN(rows.length)} follow-up(s) criado(s) para ${v.nome} em ${fmtD(p.data)}.`, 'ok');
  }catch(e){ toast(e.message, 'err'); plAtualizar(); }
}

/* ---------- Planejamento: visão semanal com arrastar e soltar ---------- */
function planToggle(){ const v = st.plan.view; return `<div class="seg"><button class="${v==='lista'?'on':''}" onclick="setPlanView('lista')">☰ Lista</button><button class="${v==='semana'?'on':''}" onclick="setPlanView('semana')">▦ Semana</button></div>`; }
function setPlanView(v){ st.plan.view = v; try{ localStorage.setItem('cap_plan_view', v); }catch(e){} pgPlan(); }
function semanaIni(iso){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate() - (d.getDay()+6)%7); return isoLocal(d); }
function pgPlanSemana(base, kpis){
  const p = st.plan, h = hoje(); if(!p.semana) p.semana = semanaIni(h);
  const ini = p.semana, dias = [0,1,2,3,4,5,6].map(i => addDias(ini, i)), q = p.q.trim().toLowerCase();
  let l = base.filter(f => f.status !== 'cancelado');
  if(q) l = l.filter(f => { const c = M.cli[f.cliente_id]||{}; return (c.nome||'').toLowerCase().includes(q) || (f.descricao||'').toLowerCase().includes(q) || discar(c.celular).includes(q) || discar(c.telefone).includes(q); });
  const ord = (a,b) => (a.status==='concluido') - (b.status==='concluido') || (a.hora||'99').localeCompare(b.hora||'99');
  const atr = ini <= h ? l.filter(f => f.status==='pendente' && f.data_prevista < ini && f.data_prevista < h).sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista)) : [];
  const mob = window.matchMedia('(max-width:700px)').matches;
  const cardH = f => { const c = M.cli[f.cliente_id]||{}, pend = f.status==='pendente', late = pend && f.data_prevista < h;
    return `<div class="wk-card ${f.status==='concluido'?'done':late?'late':''}" data-id="${f.id}" ${pend?'data-drag="1"':''}>
      <div class="wk-top"><span class="hr">${f.hora?f.hora.slice(0,5):(late&&f.data_prevista<ini?fmtDM(f.data_prevista):'')}</span><span class="tag or">${esc(f.motivo)}</span></div>
      <b>${esc(c.nome||'(cliente)')}</b> ${clsTag(c)}
      ${f.descricao?`<div class="wk-ds">${esc(f.descricao)}</div>`:''}
      <div class="small muted">👩‍💼 ${esc(vendNome(f.vendedora_id))}${curEmp()?'':' · '+esc(empNome(f.empresa_id))}</div>
      <div class="wk-ac">${pend ? `<button class="btn sec sm" onclick="abrirFollowup({id:${f.id}})">✎</button><button class="playbtn" title="Iniciar ligação" onclick="abrirLigacao({followupId:${f.id}})">▶</button>` : '<span class="tag ok">Concluído</span>'}</div></div>`; };
  const col = (d) => { const it = l.filter(f => f.data_prevista === d).sort(ord), pend = it.filter(f=>f.status==='pendente').length;
    return `<div class="wk-col ${d===h?'today':''} ${d<h?'past':''}" data-date="${d}" ${d>=h?'data-drop="1"':''}>
      <div class="wk-h"><span>${d===h?'Hoje · ':''}${nomeDia(d).slice(0,3)} ${fmtDM(d)}</span><span class="n">${pend}</span></div>

const DR = { on:false, cand:null };
function wkBind(){
  const b = $('wkBoard'); if(!b) return;
  b.addEventListener('mousedown', e => { if(e.button !== 0) return; const c = e.target.closest('.wk-card[data-drag]'); if(!c || e.target.closest('button,a')) return; e.preventDefault(); DR.cand = { c, x:e.clientX, y:e.clientY, mouse:true }; });
  b.addEventListener('touchstart', e => { const c = e.target.closest('.wk-card[data-drag]'); if(!c || e.target.closest('button,a') || e.touches.length > 1) return; const t = e.touches[0];
    DR.cand = { c, x:t.clientX, y:t.clientY }; clearTimeout(DR.timer);
    DR.timer = setTimeout(() => { if(DR.cand && !DR.on){ dragIni(DR.cand.c, DR.cand.x, DR.cand.y); try{ navigator.vibrate && navigator.vibrate(25); }catch(err){} } }, 350); }, { passive:true });
}
function dragIni(c, x, y){
  const r = c.getBoundingClientRect(), g = c.cloneNode(true);
  Object.assign(DR, { on:true, c, g, id:Number(c.dataset.id), dx:x-r.left, dy:y-r.top, x, y, over:null });
  g.classList.add('wk-ghost'); g.style.width = r.width+'px'; document.body.appendChild(g);
  c.classList.add('dragging'); document.body.classList.add('drag-on'); dragMove(x, y); DR.raf = requestAnimationFrame(dragLoop);
}
function dragMove(x, y){
  DR.x = x; DR.y = y; DR.g.style.left = (x-DR.dx)+'px'; DR.g.style.top = (y-DR.dy)+'px';
  const el = document.elementFromPoint(x, y), col = el && el.closest('.wk-col[data-drop]');
  if(col !== DR.over){ if(DR.over) DR.over.classList.remove('over'); DR.over = col; if(col) col.classList.add('over'); }
}
function dragLoop(){
  if(!DR.on) return;
  const vh = window.innerHeight, b = $('wkBoard');
  if(DR.y < 90) window.scrollBy(0, -14); else if(DR.y > vh-110) window.scrollBy(0, 14);
  if(b && b.scrollWidth > b.clientWidth){ const r = b.getBoundingClientRect(); if(DR.x < r.left+50) b.scrollLeft -= 14; else if(DR.x > r.right-50) b.scrollLeft += 14; }
  dragMove(DR.x, DR.y); DR.raf = requestAnimationFrame(dragLoop);
}
function dragFim(){
  cancelAnimationFrame(DR.raf); DR.on = false; DR.cand = null; document.body.classList.remove('drag-on');
  if(DR.g) DR.g.remove(); if(DR.c) DR.c.classList.remove('dragging'); if(DR.over) DR.over.classList.remove('over');
  const f = db.followups.find(x => x.id === DR.id), alvo = DR.over && DR.over.dataset.date;
  DR.g = DR.c = DR.over = null;
  if(f && alvo && alvo !== f.data_prevista) moverFU(f, alvo);
}
async function moverFU(f, data){
  const antes = f.data_prevista; f.data_prevista = data; pgPlan();
  try{ Object.assign(f, await api.upd('followups', f.id, { data_prevista:data })); montarNav(); toast(`${cliNome(f.cliente_id)} → ${nomeDia(data)} ${fmtDM(data)}`, 'ok'); }
  catch(e){ f.data_prevista = antes; pgPlan(); toast(e.message, 'err'); }
}
document.addEventListener('mousemove', e => { if(DR.on) return dragMove(e.clientX, e.clientY); if(DR.cand && DR.cand.mouse && Math.hypot(e.clientX-DR.cand.x, e.clientY-DR.cand.y) > 5) dragIni(DR.cand.c, e.clientX, e.clientY); });
document.addEventListener('mouseup', () => { if(DR.on) dragFim(); DR.cand = null; });
document.addEventListener('touchmove', e => { const t = e.touches[0]; if(DR.on){ e.preventDefault(); dragMove(t.clientX, t.clientY); } else if(DR.cand && Math.hypot(t.clientX-DR.cand.x, t.clientY-DR.cand.y) > 8){ clearTimeout(DR.timer); DR.cand = null; } }, { passive:false });
document.addEventListener('touchend', () => { clearTimeout(DR.timer); if(DR.on) dragFim(); DR.cand = null; });
document.addEventListener('touchcancel', () => { clearTimeout(DR.timer); if(DR.on) dragFim(); DR.cand = null; });
document.addEventListener('contextmenu', e => { if(DR.on || (DR.cand && !DR.cand.mouse)) e.preventDefault(); });

function callPlayAuto(){ if(st.call && !st.call.t0) callPlay(); }
function callPlay(){
  const C = st.call; if(!C) return;

function ligFiltradas(){
  const p = st.lig, q = p.q.trim().toLowerCase();
  return ligVisiveis().filter(l => { const d = dataDeTs(l.inicio);
    if(p.de && d < p.de) return false; if(p.ate && d > p.ate) return false;
    if(p.vend && String(l.vendedora_id) !== String(p.vend)) return false;
    if(!clsOk(l.cliente_id, p.cls)) return false;
    if(p.res === '_efet' && !efetivo(l.resultado)) return false;
    if(p.res && p.res !== '_efet' && l.resultado !== p.res) return false;
    if(q){ const c = M.cli[l.cliente_id]||{}; if(!(c.nome||'').toLowerCase().includes(q) && !(l.descricao||'').toLowerCase().includes(q)) return false; }
    return true; });
}

/* ---------- Importar clientes da planilha (Microvix) — empresa pelo nome do arquivo ---------- */
const XLSX_SRC = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
const XLSX_SRI = 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw';
let IMP = [];
function carregarScript(src, sri, msg){
  return new Promise((ok, erro) => { const sc = document.createElement('script'); sc.src = src; sc.integrity = sri; sc.crossOrigin = 'anonymous';
    sc.onload = ok; sc.onerror = () => erro(new Error(msg)); document.head.appendChild(sc); });
}
function carregarXLSX(){
  if(window.XLSX) return Promise.resolve();
  return carregarScript(XLSX_SRC, XLSX_SRI, 'Não foi possível carregar o leitor de planilhas. Verifique a internet e tente de novo.');
}
const normNome = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
function empresaPeloArquivo(nomeArq){
  const alvo = String(nomeArq).toUpperCase();
  const cand = db.empresas.filter(e => e.ativo).map(e => ({ e, re: new RegExp(e.nome.toUpperCase().split('').map(ch => /[A-Z0-9]/.test(ch) ? ch : '.?').join('')) }))
    .filter(x => x.re.test(alvo) || alvo.includes(e_cod(x.e))).sort((a,b) => b.e.nome.length - a.e.nome.length);
  return cand.length ? cand[0].e : null;
}
function e_cod(e){ return (e.codigo||'').toUpperCase(); }
function dataPlanilha(v){
  if(v === null || v === undefined || v === '' || v === '-') return null;
  if(typeof v === 'number'){ const d = new Date(Math.round((v - 25569) * 86400000)); return isNaN(d) ? null : d.toISOString().slice(0,10); }
  const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(!m) return null;
  let a = Number(m[3]); if(a < 100) a += a > 30 ? 1900 : 2000;
  const iso = a+'-'+pad(m[2])+'-'+pad(m[1]), d = new Date(iso+'T12:00:00');
  return (!isNaN(d) && isoLocal(d) === iso) ? iso : null;
}
const telPlanilha = v => { const t = String(v ?? '').trim(); return (!t || t === '-') ? null : t; };
async function lerPlanilha(file){
  const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
  const hi = rows.findIndex(r => r.some(c => normNome(c).startsWith('NOME')));
  if(hi < 0) throw new Error(`${file.name}: não encontrei a coluna "Nome/Razão Social".`);
  const H = rows[hi].map(normNome), col = p => H.findIndex(x => x.startsWith(p));
  const cN = col('NOME'), cT = col('TEL'), cC = col('CEL'), cD = H.findIndex(x => x.includes('NASC'));
  return rows.slice(hi+1).map(r => ({ nome: String(r[cN] ?? '').replace(/\s+/g,' ').trim(), telefone: cT>=0 ? telPlanilha(r[cT]) : null, celular: cC>=0 ? telPlanilha(r[cC]) : null, data_nascimento: cD>=0 ? dataPlanilha(r[cD]) : null })).filter(r => r.nome);
}
const chaveCli = (emp, c) => emp+'|'+normNome(c.nome)+'|'+discar(c.celular||c.telefone||'');
function analisarImp(){
  IMP.forEach(f => {
    const emp = Number(f.emp), exist = new Set(db.clientes.filter(c => c.empresa_id === emp).map(c => chaveCli(emp, c))), vistos = new Set();
    f.novos = []; f.jaExiste = 0; f.dup = 0;
    f.linhas.forEach(r => { const k = chaveCli(emp, r); if(exist.has(k)) f.jaExiste++; else if(vistos.has(k)) f.dup++; else { vistos.add(k); f.novos.push(r); } });
  });
}
function abrirImportacao(){
  IMP = [];
  abrirModal('⬆ Importar clientes', `
    <p style="margin-top:0">Selecione as planilhas de clientes do Microvix. A empresa é identificada pelo <b>nome do arquivo</b> (ex.: <i>CLIENTES 2026 - ELEVE.xlsx</i>). Clientes que já existem na empresa (mesmo nome e telefone) não são duplicados.</p>
    <input type="file" id="impArq" accept=".xlsx,.xls,.csv" multiple onchange="impSelecionar(this.files)">
    <div id="impLista"></div>`,
    `<button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="impOk" disabled onclick="impExecutar()">Importar</button>`, true);
}
async function impSelecionar(files){
  if(!files || !files.length) return;
  $('impLista').innerHTML = '<p class="muted">Lendo planilhas…</p>'; $('impOk').disabled = true;
  try{
    await carregarXLSX(); IMP = [];
    for(const f of files){ const e = empresaPeloArquivo(f.name); IMP.push({ arq:f.name, emp: e ? e.id : '', linhas: await lerPlanilha(f) }); }
    impRender();
  }catch(e){ $('impLista').innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; }
}
function impRender(){
  analisarImp();
  $('impLista').innerHTML = IMP.map((f,i) => `<div class="imp-file"><div class="nm">📄 ${esc(f.arq)}</div>
    <div class="form" style="margin-top:8px"><div class="full"><label>Empresa ${f.emp?'(identificada pelo nome do arquivo)':''}</label><select onchange="IMP[${i}].emp=this.value;impRender()"><option value="">Selecione…</option>${db.empresas.filter(e=>e.ativo).map(e=>`<option value="${e.id}" ${String(f.emp)===String(e.id)?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div></div>
    ${f.emp ? `<div class="imp-grid"><div><b>${fmtN(f.linhas.length)}</b><span>lidos</span></div><div><b style="color:var(--ok)">${fmtN(f.novos.length)}</b><span>novos</span></div><div><b>${fmtN(f.jaExiste)}</b><span>já cadastrados</span></div><div><b>${fmtN(f.novos.filter(r=>r.data_nascimento).length)}</b><span>novos c/ nascimento</span></div></div>` : '<p class="small" style="color:var(--bad)">Não identifiquei a empresa pelo nome do arquivo. Selecione acima.</p>'}
  </div>`).join('');
  const tot = IMP.reduce((s,f) => s + (f.emp ? f.novos.length : 0), 0);
  $('impOk').disabled = !tot || IMP.some(f => !f.emp); $('impOk').textContent = tot ? `Importar ${fmtN(tot)} cliente(s)` : 'Nada novo para importar';
}
async function impExecutar(){
  $('impOk').disabled = true; let feito = 0; const tot = IMP.reduce((s,f) => s + f.novos.length, 0);
  try{
    for(const f of IMP){
      for(let i = 0; i < f.novos.length; i += 500){
        const lote = f.novos.slice(i, i+500).map(r => ({ ...r, empresa_id:Number(f.emp) }));
        const r = await sbFetch('/rest/v1/clientes', { method:'POST', body:lote, headers:{ Prefer:'return=representation' } });
        (r||[]).forEach(c => { db.clientes.push(c); M.cli[c.id] = c; });
        feito += lote.length; $('impOk').textContent = `Importando… ${fmtN(feito)} de ${fmtN(tot)}`;
      }
    }
    fecharModal(true); toast(`${fmtN(feito)} cliente(s) importado(s).`, 'ok'); montarNav(); pgCli();
  }catch(e){ toast(`Parou em ${fmtN(feito)} de ${fmtN(tot)}: ${e.message}. Rode de novo — os já importados não duplicam.`, 'err'); impRender(); }
}

    <td>${!isAdmin() ? us.map(u=>`<span class="tag ok">${esc(u.email)}</span>`).join(' ') : us.length?us.map(u=>`<span class="tag ${u.ativo?'ok':''}">${esc(u.email)}${u.ativo?'':' (inativo)'}</span>`).join(' ')+` <button class="btn sec sm" title="Empresa e logins" onclick="abrirVinculo(${v.id})">🔗</button>`:`<button class="btn sm" onclick="abrirVinculo(${v.id})">🔗 Vincular empresa e usuário</button>`}</td><td>${v.ativa?'<span class="tag ok">Ativa</span>':'<span class="tag">Inativa</span>'}</td>
    <td class="act">${isAdmin() ? `<button class="btn sec sm" onclick="abrirMetas(${v.id})">🎯 Metas</button> ` : ''}<button class="btn sec sm" onclick="abrirVend(${v.id})">✎</button>${isAdmin() ? ` <button class="btn danger sm" title="Excluir vendedora" onclick="excluirVend(${v.id})">🗑</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Nenhuma vendedora cadastrada.</td></tr>'}
  </tbody></table></div>`;
}
async function patchUsuario(id, o){
  const r = await sbFetch(`/rest/v1/usuarios?id=eq.${id}`, { method:'PATCH', body:o, headers:{ Prefer:'return=representation' } });
  const k = db.usuarios.findIndex(x => x.id === id); if(r && r[0]){ if(k >= 0) db.usuarios[k] = r[0]; else db.usuarios.push(r[0]); }
  return r && r[0];
}
async function setVinculos(uid, vids){
  const atuais = db.uv.filter(x => x.usuario_id === uid).map(x => Number(x.vendedora_id));
  const rem = atuais.filter(v => !vids.includes(v)), add = vids.filter(v => !atuais.includes(v));
  try{
    if(rem.length) await sbFetch(`/rest/v1/usuario_vendedoras?usuario_id=eq.${uid}&vendedora_id=in.(${rem.join(',')})`, { method:'DELETE' });
    if(add.length) await sbFetch('/rest/v1/usuario_vendedoras', { method:'POST', body: add.map(v => ({ usuario_id:uid, vendedora_id:v })), headers:{ Prefer:'resolution=ignore-duplicates,return=minimal' } });
  }catch(e){ if(/usuario_vendedoras/i.test(e.message)) throw new Error('Tabela de vínculos não encontrada. Execute o 03_login_varias_vendedoras.sql no Supabase.'); throw e; }
  db.uv = db.uv.filter(x => !(x.usuario_id === uid && rem.includes(Number(x.vendedora_id)))).concat(add.map(v => ({ usuario_id:uid, vendedora_id:v })));
}
async function aplicarVinculos(u, nova, nomePadrao){
  await setVinculos(u.id, nova);
  const o = { vendedora_id: nova[0] || null };
  if(nova.length){ o.perfil = 'vendedora'; o.ativo = true; if(nova.length === 1 && nomePadrao && (!u.nome || u.nome === (u.email||'').split('@')[0])) o.nome = nomePadrao; }
  else o.ativo = false;
  await patchUsuario(u.id, o);
}
function abrirVinculo(vid){
  const v = M.vend[vid], logins = db.usuarios.filter(u => u.perfil !== 'admin').sort((a,b) => (a.email||'').localeCompare(b.email||''));
  const temHist = db.followups.some(f => f.vendedora_id === vid) || db.ligacoes.some(l => l.vendedora_id === vid);
  abrirModal('🔗 Empresa e logins · '+esc(v.nome), `
    <p style="margin-top:0">Quem entra com um login enxerga <b>somente a empresa</b> das vendedoras vinculadas e <b>somente os números delas</b>. Um mesmo login pode ter <b>várias vendedoras</b>, de qualquer empresa (ex.: login do caixa da loja). Apenas o administrador vê tudo.</p>
    <div class="form"><div class="full"><label>Empresa vinculada *</label><select id="vcEmp">${db.empresas.filter(e => e.ativo || e.id === v.empresa_id).map(e => `<option value="${e.id}" ${e.id===v.empresa_id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div></div>
    <label style="display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 6px">Logins com acesso a esta vendedora</label>
    ${logins.map(u => { const outras = vincDe(u.id).filter(x => x !== vid), eo = outras.length ? (M.vend[outras[0]]||{}).empresa_id : null;
      return `<label class="ck-row"><input type="checkbox" class="vcCk" value="${u.id}" ${vincDe(u.id).includes(vid)?'checked':''}><span><b>${esc(u.email)}</b>${u.ativo?'':' <span class="tag">inativo</span>'}<br><span class="small muted">${outras.length ? 'Também acessa: '+outras.map(x => esc(vendNome(x))).join(', ')+' · '+esc(empNome(eo)) : 'Sem outras vendedoras'}</span></span></label>`; }).join('') || '<div class="muted small">Nenhum login cadastrado. Crie o login no Supabase (Authentication → Users → Add user) e clique em ↻.</div>'}
    ${temHist ? '<p class="small muted">Se trocar a empresa, os follow-ups e ligações já registrados continuam na empresa anterior (histórico).</p>' : ''}`,
    `<button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn sec" onclick="fecharModal(true);abrirUsuario(null,${vid})">🔑 Criar novo login</button><button class="btn" id="vcOk" onclick="salvarVinculo(${vid})">Salvar</button>`);
}
async function salvarVinculo(vid){
  const v = M.vend[vid], emp = Number($('vcEmp').value), marc = [...document.querySelectorAll('.vcCk:checked')].map(i => i.value), mud = [];
  for(const u of db.usuarios.filter(x => x.perfil !== 'admin')){
    const at = vincDe(u.id), tem = at.includes(vid), quer = marc.includes(u.id);
    const nova = quer ? (tem ? at : [...at, vid]) : at.filter(x => x !== vid);
    if(tem !== quer) mud.push({ u, nova, quer });
  }
  const mudouEmp = emp !== v.empresa_id;
  if(!mudouEmp && !mud.length){ fecharModal(true); return; }
  $('vcOk').disabled = true;
  try{
    if(mudouEmp) Object.assign(v, await api.upd('vendedoras', vid, { empresa_id:emp }));
    for(const m of mud) await aplicarVinculos(m.u, m.nova, v.nome);
    fecharModal(true);
    toast([mudouEmp ? 'Empresa vinculada: '+empNome(emp) : '', mud.length ? `${mud.filter(m=>m.quer).length} login(s) vinculado(s), ${mud.filter(m=>!m.quer).length} desvinculado(s)` : ''].filter(Boolean).join(' · ') + '.', 'ok');
    pgVend();
  }catch(e){ toast(e.message, 'err'); $('vcOk').disabled = false; }
}
async function excluirVend(id){
  const v = M.vend[id]; if(!v) return;
  const nL = db.ligacoes.filter(l => l.vendedora_id === id).length, nF = db.followups.filter(f => f.vendedora_id === id).length;
  if(nL || nF) return abrirModal('Não é possível excluir',
    `<p style="margin-top:0"><b>${esc(v.nome)}</b> tem ${fmtN(nL)} ligação(ões) e ${fmtN(nF)} follow-up(s) registrados. Para não perder o histórico e os gráficos, ela não pode ser excluída.</p><p>Use <b>Inativar</b>: ela sai das listas e não recebe novos agendamentos, mas o histórico continua.</p>`,
    `<button class="btn sec" onclick="fecharModal()">Fechar</button>${v.ativa?`<button class="btn" onclick="inativarVend(${id})">Inativar</button>`:''}`);
  const nC = db.clientes.filter(c => c.vendedora_id === id).length;
  if(!confirm(`Excluir a vendedora ${v.nome}?${nC ? `\n${nC} cliente(s) da carteira dela ficarão sem carteira.` : ''}\nEssa ação não pode ser desfeita.`)) return;
  loading(true, 'Excluindo…');
  try{
    if(nC) await sbFetch(`/rest/v1/clientes?vendedora_id=eq.${id}`, { method:'PATCH', body:{ vendedora_id:null } });
    await sbFetch(`/rest/v1/metas?vendedora_id=eq.${id}`, { method:'DELETE' });
    for(const u of db.usuarios.filter(u => u.perfil !== 'admin' && vincDe(u.id).includes(id))) await aplicarVinculos(u, vincDe(u.id).filter(x => x !== id));
    await api.del('vendedoras', id);
    db.clientes.forEach(c => { if(c.vendedora_id === id) c.vendedora_id = null; });
    db.metas = db.metas.filter(m => m.vendedora_id !== id); db.uv = db.uv.filter(x => Number(x.vendedora_id) !== id);
    db.vendedoras = db.vendedoras.filter(x => x.id !== id); delete M.vend[id];
    toast('Vendedora excluída.', 'ok'); pgVend();
  }catch(e){ toast(e.message, 'err'); }
  finally{ loading(false); }
}
async function inativarVend(id){
  try{ Object.assign(M.vend[id], await api.upd('vendedoras', id, { ativa:false })); fecharModal(true); toast('Vendedora inativada.', 'ok'); pgVend(); }
