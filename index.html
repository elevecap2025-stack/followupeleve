async function salvarMetas(vid){
  $('mtSalvar').disabled = true;
  try{
    const ups = [], dels = [];
    document.querySelectorAll('.mtIn').forEach(i => { const comp = i.dataset.comp, r = db.metas.find(x=>x.vendedora_id===vid && x.competencia===comp);
      if(i.value === ''){ if(r) dels.push(r); } else ups.push({ vendedora_id:vid, competencia:comp, meta_ligacoes:Number(i.value)||0 }); });
    if(ups.length){ const r = await sbFetch('/rest/v1/metas?on_conflict=vendedora_id,competencia', { method:'POST', body:ups, headers:{ Prefer:'resolution=merge-duplicates,return=representation' } });
      r.forEach(n => { const k = db.metas.findIndex(x => x.vendedora_id===n.vendedora_id && x.competencia===n.competencia); if(k>=0) db.metas[k] = n; else db.metas.push(n); }); }

async function salvarUsuario(uid){
  const perfil = $('usPerfil').value, vids = perfil==='admin' ? [] : [...document.querySelectorAll('.usVk:checked')].map(i => Number(i.value));
  const o = { nome:$('usNome').value.trim(), perfil, vendedora_id:vids[0]||null, ativo:$('usAtivo').value==='1', cargo:$('usCargo').value.trim()||null, telefone:$('usTel').value.trim()||null };
  if(db.perfis.length || $('usPf').value) o.perfil_id = perfil==='admin' ? null : (Number($('usPf').value) || null);
  if(!o.nome) return toast('Informe o nome.', 'err');
  if(uid === db.me.id && (perfil!=='admin' || !o.ativo)) return toast('Você não pode remover seu próprio acesso de administrador.', 'err');
  $('usSalvar').disabled = true;
  try{
    if(!uid){
      const email = $('usEmail').value.trim().toLowerCase(), senha = $('usSenha').value;
      if(!email || senha.length < 8){ $('usSalvar').disabled = false; return toast('Informe e-mail e senha (mín. 8 caracteres).', 'err'); }
      const r = await authReq('signup', { email, password:senha, data:{ nome:o.nome } });
      uid = (r.user && r.user.id) || r.id;
      if(!uid) throw new Error('Não foi possível criar o usuário.');
      await new Promise(res => setTimeout(res, 600));
    }
    if(perfil !== 'admin' && $('usCriaV') && $('usCriaV').checked){
      const nv = await criarVendedoraPara({ nome:o.nome, email:(db.usuarios.find(x => x.id === uid)||{}).email || $('usEmail').value.trim().toLowerCase(), telefone:o.telefone }, Number($('usCriaEmp').value), Number($('usCriaMeta').value)||0);
      if(!vids.includes(nv.id)) vids.unshift(nv.id); o.vendedora_id = vids[0];
    }
    const rows = await sbFetch(`/rest/v1/usuarios?id=eq.${uid}`, { method:'PATCH', body:o, headers:{ Prefer:'return=representation' } });
    if(!rows || !rows.length) throw new Error('Usuário criado no Auth, mas o perfil não foi encontrado. Verifique se o script do banco (trigger) foi executado.');
    const k = db.usuarios.findIndex(x => x.id === uid); if(k>=0) db.usuarios[k] = rows[0]; else db.usuarios.push(rows[0]);
    await setVinculos(uid, vids);
    fecharModal(true); toast('Acesso salvo.', 'ok'); ir(st.page);
  }catch(e){ toast(e.message, 'err'); $('usSalvar').disabled = false; }
}

/* Cria a vendedora (para follow-ups e ligações) com os dados do usuário */
async function criarVendedoraPara(u, empId, meta){
  if(!empId) throw new Error('Cadastre uma empresa antes de criar vendedoras.');
  let r;
  try{ r = await api.ins('vendedoras', { nome:u.nome, empresa_id:empId, meta_mensal_padrao:meta||0, telefone:u.telefone||null, email:u.email||null, ativa:true }); }
  catch(e){ throw new Error('Não foi possível cadastrar a vendedora "'+u.nome+'": '+e.message); }
  if(!r) throw new Error('O banco não devolveu a vendedora criada. Rode o 13_pedido_reparo.sql no Supabase.');
  db.vendedoras.push(r); M.vend[r.id] = r; return r;
}

function permMarcar(uid, k, on){ const s = st.perm[uid]; if(on) s.add(k); else s.delete(k); }
function permTodas(uid, on){
  st.perm[uid] = new Set(on ? TELAS_PERM : []);
  document.querySelectorAll(`input[data-u="${uid}"]`).forEach(i => i.checked = on);
}
async function salvarPerm(){
  const mud = [];
  for(const u of db.usuarios.filter(x => x.perfil !== 'admin')){
    const sel = st.perm[u.id]; if(!sel) continue;
    const novo = TELAS_OPER.every(k => sel.has(k)) && !sel.has('vendedoras') ? null : TELAS_PERM.filter(k => sel.has(k));
    if(JSON.stringify(novo) !== JSON.stringify(Array.isArray(u.telas) ? TELAS_PERM.filter(k => u.telas.includes(k)) : null)) mud.push({ u, novo });
  }
  const vazio = mud.find(m => m.novo && !m.novo.length && m.u.ativo);
  if(vazio && !confirm(`${vazio.u.email} ficará sem nenhuma tela liberada e não conseguirá usar o sistema. Continuar?`)) return;
  if(!mud.length) return toast('Nenhuma alteração para salvar.');
  $('permOk').disabled = true;
  try{
    for(const m of mud) await patchUsuario(m.u.id, { telas: m.novo });
    toast(`Permissões salvas (${mud.length} usuário(s)).`, 'ok'); pgPerm();
  }catch(e){ toast(/telas/i.test(e.message) ? 'Coluna de permissões não encontrada. Execute o 07_permissoes_telas.sql no Supabase.' : e.message, 'err'); $('permOk').disabled = false; }
}

const JSPDF_SRC = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
const JSPDF_SRI = 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk';
const AUTOT_SRC = 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';
const AUTOT_SRI = 'sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3';
async function carregarPDF(){
  const msg = 'Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.';
  if(!window.jspdf) await carregarScript(JSPDF_SRC, JSPDF_SRI, msg);

}
function logoDataURL(){ const m = getComputedStyle(document.documentElement).getPropertyValue('--logo').match(/url\(["']?(data:[^"')]+)["']?\)/); return m ? m[1] : null; }
const pdfTxt = v => String(v ?? '').replace(/[^\u0000-ÿ]/g, '').replace(/\s+/g, ' ').trim();
async function gerarPDF({ titulo, subtitulo, resumo, colunas, linhas, arquivo, paisagem, estilos, kpis, graficos, fonte }){
  loading(true, 'Gerando PDF…');
  try{
    await carregarPDF();
    const doc = new window.jspdf.jsPDF({ orientation: paisagem ? 'landscape' : 'portrait', unit:'mm', format:'a4', compress:true });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), logo = logoDataURL();
    const gerado = 'Gerado em ' + fmtDH(new Date().toISOString()) + ' por ' + pdfTxt(db.me.nome || db.me.email);
    const empresa = 'Empresa: ' + (curEmp() ? empNome(curEmp()) : 'Todas');
    const cab = () => {
      if(logo) try{ doc.addImage(logo, 'PNG', 12, 7, 27, 18, 'caplogo', 'FAST'); }catch(e){}
      doc.setTextColor(43,47,54); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(pdfTxt(titulo), 44, 14);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(107,114,128);
      doc.text(pdfTxt([subtitulo, empresa].filter(Boolean).join('   |   ')), 44, 19.5); doc.text(pdfTxt(gerado), 44, 24);
      doc.setDrawColor(18,125,203); doc.setLineWidth(0.9); doc.line(12, 28, W-12, 28);
    };
    cab();
    let y = 33;
    if(kpis && kpis.length){
      const porLinha = paisagem ? 6 : 4, gap = 3, bw = (W - 24 - gap*(porLinha-1)) / porLinha, bh = 16;
      kpis.forEach((k, i) => { const col = i % porLinha, x = 12 + col*(bw+gap); if(i && col === 0) y += bh + gap;
        doc.setFillColor(250,250,251); doc.setDrawColor(229,231,235); doc.setLineWidth(0.2); doc.rect(x, y, bw, bh, 'FD');
        doc.setFillColor(18,125,203); doc.rect(x, y, 1.2, bh, 'F');
        doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(107,114,128); doc.text(pdfTxt(k[0]), x+3.5, y+4.5);
        doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(31,35,40); doc.text(pdfTxt(k[1]), x+3.5, y+10.5);
        if(k[2]){ doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(107,114,128); doc.text(pdfTxt(k[2]), x+3.5, y+14.2, { maxWidth: bw-5 }); } });
      y += bh + 6;
    }
    if(resumo){ doc.setFontSize(9.5); doc.setTextColor(43,47,54); doc.setFont('helvetica','bold'); doc.text(pdfTxt(resumo), 12, y); y += 4; }
    doc.autoTable({
      head: [colunas.map(pdfTxt)], body: linhas.map(r => r.map(pdfTxt)), startY: y, margin: { top: 33, left: 12, right: 12, bottom: 14 },
      styles: { font:'helvetica', fontSize: fonte || 8, cellPadding: fonte && fonte < 7 ? 1.2 : 1.8, textColor:[31,35,40], lineColor:[229,231,235], lineWidth:0.1, overflow:'linebreak' },
      headStyles: { fillColor:[18,125,203], textColor:255, fontStyle:'bold' },
      alternateRowStyles: { fillColor:[240,246,252] }, columnStyles: estilos || {},
      didDrawPage: d => { if(d.pageNumber > 1) cab(); }
    });
    if(graficos && graficos.length){
      let gy = doc.lastAutoTable.finalY + 8, col = 0, alturaLinha = 0;
      const gap = 6, gw = (W - 24 - gap) / 2;
      for(const g of graficos){
        const cv = $(g.canvas); if(!cv || !cv.width) continue;
        const gh = gw * cv.height / cv.width;
        if(col === 0 && gy + gh + 6 > H - 14){ doc.addPage(); cab(); gy = 34; }
        const x = 12 + col * (gw + gap);
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(43,47,54); doc.text(pdfTxt(g.titulo), x, gy);
        try{ doc.addImage(cv.toDataURL('image/png'), 'PNG', x, gy + 2, gw, gh); }catch(e){}
        alturaLinha = Math.max(alturaLinha, gh + 8);
        if(col === 1){ gy += alturaLinha; col = 0; alturaLinha = 0; } else col = 1;
      }
    }
    const n = doc.internal.getNumberOfPages();
    for(let i = 1; i <= n; i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(107,114,128); doc.setDrawColor(58,63,71); doc.setLineWidth(0.3); doc.line(12, H-10, W-12, H-10);
      doc.text('Eleve  -  Acompanhamento de Ligações  -  C@P Consultoria', 12, H-6); doc.text('Página ' + i + ' de ' + n, W-12, H-6, { align:'right' }); }
    doc.save(arquivo);
    toast('PDF gerado.', 'ok');
  }catch(e){ toast(e.message, 'err'); }
  finally{ loading(false); }
}

/* ============================ PLANO DE AÇÃO • 5W2H ============================ */
const PA_STATUS = ['Não iniciado','Em andamento','Concluído','Atrasado','Cancelado'];
/* Status automático: Concluído (100%), Atrasado (passou do fim), Em andamento (>0%), Não iniciado. Só "Cancelado" é manual. */
function paStatus(x){ if(x.status === 'Cancelado') return 'Cancelado'; const pr = paPct(x); return pr >= 100 ? 'Concluído' : x.fim && x.fim < hoje() ? 'Atrasado' : pr > 0 ? 'Em andamento' : 'Não iniciado'; }
const PA_TAG = { 'Não iniciado':'warn', 'Em andamento':'info', 'Concluído':'ok', 'Atrasado':'bad', 'Cancelado':'' };
const diasEntre = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
/* Lead time: dias do início até o fim (sem fim = até hoje) */
function paLead(x){ return x.inicio ? Math.max(0, diasEntre(x.inicio, x.fim || hoje())) : null; }
/* % previsto pelo prazo: quanto do período início→fim já passou */
function paPrev(x){ if(!x.inicio || !x.fim) return null; const tot = diasEntre(x.inicio, x.fim); if(tot <= 0) return hoje() >= x.fim ? 100 : 0; return Math.max(0, Math.min(100, Math.round(diasEntre(x.inicio, hoje()) / tot * 100))); }
const paEtapas = x => Array.isArray(x.etapas) ? x.etapas : [];
/* % realizado: etapas concluídas ÷ total (sem etapas = % informado) */
function paPct(x){ const e = paEtapas(x); return e.length ? Math.round(e.filter(s => s.ok).length / e.length * 100) : Math.max(0, Math.min(100, x.percentual || 0)); }
function paBar(x){
  const pr = paPct(x), e = paEtapas(x), enc = ['Concluído','Cancelado'].includes(paStatus(x)), pv = enc ? null : paPrev(x);
  const cor = pr >= 100 ? 'var(--ok)' : pv == null ? 'var(--or)' : pr >= pv ? 'var(--ok)' : pr >= pv - 15 ? 'var(--warn)' : 'var(--bad)';
  return `<div class="pa-bar" title="Realizado ${pr}%${pv != null ? ' · previsto pelo prazo ' + pv + '%' : ''}"><div class="pa-bar-f" style="width:${pr}%;background:${cor}"></div>${pv != null ? `<i style="left:${pv}%"></i>` : ''}</div>
    <div class="pa-bar-l"><b>${pr}%</b>${pv != null ? ` <span class="muted">· prev. ${pv}%</span>` : ''}${e.length ? `<div class="muted">${e.filter(s => s.ok).length}/${e.length} etapas</div>` : ''}</div>`;
}
function paLeadLive(){ const i = $('paIni').value, f = $('paFim').value; $('paLead').value = i ? Math.max(0, diasEntre(i, f || hoje())) : ''; $('paLeadObs').textContent = i && !f ? 'contando até hoje' : ''; }
function paEtRender(){
  const d = st.paEtDono, l = st.paEt, ok = l.filter(s => s.ok).length, pct = $('paPct');
  $('paEtList').innerHTML = l.map((s,i) => `<div class="pa-et"><input type="checkbox" ${s.ok?'checked':''} onchange="st.paEt[${i}].ok=this.checked;st.paEt[${i}].em=this.checked?new Date().toISOString():null;paEtRender()"><input value="${esc(s.t)}" ${d?'':'disabled'} placeholder="Descreva a etapa" oninput="st.paEt[${i}].t=this.value">${d?`<button class="btn danger sm" title="Remover" onclick="st.paEt.splice(${i},1);paEtRender()">✕</button>`:''}</div>`).join('')
    || '<div class="small muted">Sem etapas: o % é informado manualmente. Cadastre etapas para o % ser calculado sozinho.</div>';
  if(l.length){ const v = Math.round(ok / l.length * 100); pct.value = v; pct.disabled = true; $('paEtRes').innerHTML = `<div class="pa-bar" style="margin-top:6px"><div class="pa-bar-f" style="width:${v}%;background:${v>=100?'var(--ok)':'var(--or)'}"></div></div><div class="small" style="margin-top:4px"><b>${ok} de ${l.length}</b> etapas concluídas = <b>${v}%</b></div>`; }
  else { pct.disabled = false; $('paEtRes').innerHTML = ''; }
}
function paEtDoComo(){
  const linhas = $('paComo').value.split(/\n+/).map(t => t.replace(/^\s*(\d+\s*[-.)–]?\s*|[-•*]\s*)/, '').trim()).filter(Boolean);
  if(!linhas.length) return toast('Escreva as etapas no campo "Como?", uma por linha.', 'err');
  linhas.forEach(t => { if(!st.paEt.some(s => s.t === t)) st.paEt.push({ t, ok:false }); }); paEtRender();
}
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
function pessoaNome(id){ const p = (db.pessoas||[]).find(x => x.id === id); return p ? (p.nome || p.email) : (db.me && id === db.me.id ? (db.me.nome || db.me.email) : '—'); }
const paPend = () => db.me ? (db.planos||[]).filter(p => p.responsavel_id === db.me.id && !p.ciente_em && p.criado_por !== db.me.id) : [];

async function salvarPA(id){

    toast(ids.length > 1 ? 'Ciente registrado nas ações.' : 'Ciente registrado.', 'ok');
    return true;
  }catch(e){ toast(e.message, 'err'); return false; }
}
/* Aprovação imediata: quem recebe a ação vê o aviso ao entrar e a cada minuto */
function abrirCiente(depois){
  if(depois !== undefined) st.cienteDepois = depois;
  const l = paPend(); l.forEach(x => st.cienteVisto.add(x.id));
  const seguir = () => { const f = st.cienteDepois; st.cienteDepois = null; if(f) setTimeout(f, 50); };
  if(!l.length){ fecharModal(true); seguir(); return; }
  abrirModal(`📌 ${l.length > 1 ? l.length+' ações enviadas' : 'Ação enviada'} para você`,
    `<p style="margin-top:0">Confirme que está ciente ${l.length > 1 ? 'das ações' : 'da ação'} do plano de ação:</p>` +
    l.map(x => `<div class="box-info"><div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:220px">
      <b>#${x.id} · ${esc(x.o_que)}</b><div class="small muted">Enviada por ${esc(pessoaNome(x.criado_por))}</div>
      ${x.por_que?`<div><b>Por quê:</b> ${esc(x.por_que)}</div>`:''}${x.como?`<div><b>Como:</b> ${esc(x.como)}</div>`:''}${x.onde?`<div><b>Onde:</b> ${esc(x.onde)}</div>`:''}
      <div class="small">${[x.inicio?'Início '+fmtD(x.inicio):'', x.horario?'às '+x.horario.slice(0,5):'', x.fim?'Fim '+fmtD(x.fim):'', Number(x.quanto)?fmtBRL(x.quanto):''].filter(Boolean).join(' · ')}</div></div>
      <button class="btn ok sm" onclick="cientePA([${x.id}]).then(ok=>{ if(ok) abrirCiente(); })">✔ Estou ciente</button></div></div>`).join(''),
    `<button class="btn sec" onclick="fecharModal()">Ver depois</button>${l.length > 1 ? `<button class="btn ok" onclick="cientePA([${l.map(x=>x.id).join(',')}]).then(ok=>{ if(ok) abrirCiente(); })">✔ Ciente de todas</button>` : ''}`,
    true, () => { seguir(); });
}
async function checarCiente(){
  if(!S || !db.me || !db.paOk || $('app').classList.contains('hidden')) return;
  try{
    const r = await sbFetch(`/rest/v1/plano_acao?responsavel_id=eq.${db.me.id}&ciente_em=is.null&select=*`) || [];
    r.forEach(n => { const k = db.planos.findIndex(p => p.id === n.id); if(k >= 0) db.planos[k] = n; else db.planos.push(n); });
    const novos = paPend().filter(x => !st.cienteVisto.has(x.id));
    if(!novos.length){ if(!$('modal').classList.contains('show')) avisoDia(); return; }
    if(novos.some(n => !(db.pessoas||[]).some(p => p.id === n.criado_por))) await carregarPessoas();
    montarNav();
    if(!$('modal').classList.contains('show')){ if(st.page === 'plano' || st.page === 'planoconc') pgPlano(); abrirCiente(null); }
  }catch(e){}
}
setInterval(checarCiente, 60000);
function pdfPA(){
  const l = paFiltradas(), ret = st.pa.orient === 'retrato'; if(!l.length) return toast('Nenhuma ação neste filtro.', 'err');
  const ver = { todos:'Todas as minhas', equipe:'Todas as pessoas', criados:'Criadas por mim', meus:'Enviadas para mim', ciente:'Aguardando meu ciente' }[st.pa.ver] + (st.pa.pessoa ? '  -  Pessoa: '+pessoaNome(st.pa.pessoa) : '');
  gerarPDF({ titulo: paConc() ? 'Planos de Ação Concluídos' : 'Plano de Ação - 5W2H', arquivo:`${paConc()?'planos_concluidos':'plano_acao'}_${hoje()}.pdf`, paisagem:!ret, fonte: ret ? 5.8 : 7.2,
    subtitulo: ver + (st.pa.status ? '  -  Status: '+st.pa.status : '') + (st.pa.q ? '  -  Busca: '+st.pa.q : ''),
    resumo: `${l.length} ação(ões)  -  ${l.filter(x=>paStatus(x)==='Concluído').length} concluída(s)  -  ${l.filter(x=>paStatus(x)==='Em andamento').length} em andamento  -  ${l.filter(x=>paStatus(x)==='Atrasado').length} atrasada(s)  -  Total previsto ${fmtBRL(l.reduce((s,x)=>s+(Number(x.quanto)||0),0))}`,
    colunas:['ID','O quê?','Por quê?','Como?','Quem?','Início','Horário','Fim','Lead time','Onde?','Quanto?','Status','%','Observações'],
    linhas: l.map(x => [x.id, x.o_que, x.por_que||'', x.como||'', pessoaNome(x.responsavel_id) + (x.responsavel_id === x.criado_por ? '' : x.ciente_em ? ' (ciente '+fmtDH(x.ciente_em).slice(0,10)+')' : ' (aguardando ciente)'),
      x.inicio?fmtD(x.inicio):'', x.horario?x.horario.slice(0,5):'', x.fim?fmtD(x.fim):'', paLead(x) ?? '', x.onde||'', fmtBRL(x.quanto), paStatus(x), paPct(x)+'%' + (paPrev(x) != null && !['Concluído','Cancelado'].includes(paStatus(x)) ? ' (prev. '+paPrev(x)+'%)' : '') + (paEtapas(x).length ? ' - '+paEtapas(x).filter(s=>s.ok).length+'/'+paEtapas(x).length+' etapas' : ''), x.observacoes||'']),
    estilos: ret
      ? { 0:{cellWidth:6}, 1:{cellWidth:20}, 2:{cellWidth:18}, 3:{cellWidth:22}, 4:{cellWidth:16}, 5:{cellWidth:13}, 6:{cellWidth:9}, 7:{cellWidth:13}, 8:{cellWidth:8,halign:'center'}, 9:{cellWidth:12}, 10:{cellWidth:13,halign:'right'}, 11:{cellWidth:13}, 12:{cellWidth:7,halign:'center'} }
      : { 0:{cellWidth:8}, 1:{cellWidth:30}, 2:{cellWidth:28}, 3:{cellWidth:34}, 4:{cellWidth:24}, 5:{cellWidth:16}, 6:{cellWidth:13}, 7:{cellWidth:16}, 8:{cellWidth:11,halign:'center'}, 9:{cellWidth:18}, 10:{cellWidth:18,halign:'right'}, 11:{cellWidth:18}, 12:{cellWidth:9,halign:'center'} } });
}

/* Menu recolhido: só ícones (computador). A escolha fica salva neste navegador. */
function toggleMenuMin(forcar){
  const on = typeof forcar === 'boolean' ? forcar : !document.body.classList.contains('menu-min');
  document.body.classList.toggle('menu-min', on);
  const b = $('sideTg'); b.textContent = on ? '›' : '‹'; b.title = on ? 'Expandir menu' : 'Recolher menu'; b.setAttribute('aria-label', b.title);
  try{ localStorage.setItem('eleve_menu_min', on ? '1' : ''); }catch(e){}
  setTimeout(() => st.charts.forEach(c => c.resize()), 220);
}
try{ if(localStorage.getItem('eleve_menu_min')) toggleMenuMin(true); }catch(e){}

  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CONFIG.SUPABASE_URL)){ mostrarLogin('Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do script do index.html.'); return; }
  loadSess();
  if(S && S.access_token) boot(); else mostrarLogin();
})();
